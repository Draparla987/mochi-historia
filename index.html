:root{
  --sky1:#BDE8FF; --sky2:#F1FAFF; --cloud:rgba(255,255,255,.75);
  --ink:#232A4D; --ink-soft:#5C6589; --card:#FFFFFF; --line:#DDE6F4; --paper:#F7FAFF; --rule:#D8E6F6;
  
  --rojo:#F04F59; --azul:#3570F0; --verde:#1FA862; --morado:#8456F0; --naranja:#F07A12; --rosa:#DE3F96; --turquesa:#0B98AE;
  --sun:#FFC93C; --on-c:#FFFFFF;
  --ok:#1FA65A; --ok-bg:#E3F7EA; --ko:#EC4256; --ko-bg:#FFE9EC; --star:#FFB400; --star-off:#D7E0EE;
  --shadow:rgba(35,42,77,.16);
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; color:var(--ink); font-family:var(--f-read); font-size:18px; line-height:1.45;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%) fixed; background-color:var(--sky2);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60px 34px at 12% 14%,var(--cloud) 98%,transparent),radial-gradient(44px 30px at 16% 11%,var(--cloud) 98%,transparent),
    radial-gradient(80px 40px at 84% 22%,var(--cloud) 98%,transparent),radial-gradient(52px 34px at 89% 18%,var(--cloud) 98%,transparent),
    radial-gradient(70px 36px at 60% 8%,var(--cloud) 98%,transparent),
    radial-gradient(900px 260px at 50% 112%,color-mix(in srgb,var(--verde) 22%,transparent) 60%,transparent 61%)}
@supports not (color:color-mix(in srgb,red 50%,blue)){body::before{background:
    radial-gradient(60px 34px at 12% 14%,var(--cloud) 98%,transparent),radial-gradient(44px 30px at 16% 11%,var(--cloud) 98%,transparent),
    radial-gradient(80px 40px at 84% 22%,var(--cloud) 98%,transparent),radial-gradient(52px 34px at 89% 18%,var(--cloud) 98%,transparent),
    radial-gradient(70px 36px at 60% 8%,var(--cloud) 98%,transparent),
    radial-gradient(900px 260px at 50% 112%,transparent 60%,transparent 61%)}}
input{-webkit-user-select:text; user-select:text}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--azul); outline-offset:3px}
img{display:block; max-width:100%}
#app{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:10px 160px}
h1,h2,h3{font-family:var(--f-display); line-height:1.08; margin:0; text-wrap:balance; font-weight:800}
.topbar{display:flex; align-items:center; gap:10px; padding-block:4px 10px}
.brand{display:flex; align-items:center; gap:8px; margin-right:auto; background:none; border:0; padding:0; font-family:var(--f-display); font-weight:800; font-size:1.5rem}
.brand img{width:48px; height:48px; object-fit:contain; filter:drop-shadow(0 3px 2px var(--shadow))}
.pill{display:flex; align-items:center; gap:8px; min-height:52px; background:var(--card); border:0; border-radius:999px; padding:4px 16px 4px 4px; font-weight:700; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.pill .av{font-size:1.5rem; width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--sun) 40%,var(--card))}
@supports not (color:color-mix(in srgb,red 50%,blue)){.pill .av{background:var(--card)}}
.coin{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-display); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums}
.coin::before{content:"★"; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--star); color:#fff; font-size:1rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.round{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:var(--card); font-size:1.4rem; display:grid; place-items:center; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.round:active,.pill:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.btn{--c:var(--azul); display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:10px 30px; border:0; border-radius:22px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c)); color:var(--on-c); font-family:var(--f-display); font-weight:800; font-size:1.4rem;
  text-shadow:0 2px 0 rgba(0,0,0,.15); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 70%,#000),inset 0 3px 0 rgba(255,255,255,.35),0 8px 18px color-mix(in srgb,var(--c) 35%,transparent); transition:transform .08s}
@supports not (color:color-mix(in srgb,red 50%,blue)){.btn{background:linear-gradient(180deg,var(--c),var(--c));box-shadow:inset 0 -6px 0 var(--c),inset 0 3px 0 rgba(255,255,255,.35),0 8px 18px transparent}}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.ghost{background:var(--card); color:var(--ink); text-shadow:none; box-shadow:inset 0 -5px 0 var(--line),0 6px 14px var(--shadow)}
.btn.big{min-height:76px; font-size:1.65rem; padding-inline:40px}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.center{justify-content:center; text-align:center}
.mochi{object-fit:contain; filter:drop-shadow(0 10px 10px var(--shadow)); animation:float 3.2s ease-in-out infinite}
.bubble{position:relative; background:var(--card); border-radius:26px; padding:16px 22px; box-shadow:0 6px 0 var(--line),0 12px 26px var(--shadow); min-width:0}
.bubble::before{content:""; position:absolute; left:-14px; top:38px; border:14px solid transparent; border-right-color:var(--card); border-left:0}
.bubble h1{font-size:clamp(1.9rem,4.6vw,2.7rem)}
.bubble p{margin:4px 0 0; color:var(--ink-soft); font-size:1.15rem}
.say{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:color-mix(in srgb,var(--c,var(--azul)) 14%,var(--card)); color:var(--c,var(--azul)); font-size:1.4rem; display:grid; place-items:center; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,var(--azul)) 25%,var(--line))}
@supports not (color:color-mix(in srgb,red 50%,blue)){.say{background:var(--card);box-shadow:inset 0 -4px 0 var(--line)}}
.say:active{transform:scale(.94)}
.say.on{animation:pulse 1s infinite}
.hero{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px 18px; margin-block:4px 22px}
.hero .mochi{width:clamp(130px,22vw,190px)}
.hero .bubble{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.hero .bubble > div{flex:1; min-width:200px}
.subjects{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:26px 20px; padding-top:14px}
.subj{--c:var(--azul); position:relative; text-align:left; border:0; border-radius:var(--r); padding:22px 22px 20px; min-height:190px; color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff) 0%,var(--c) 62%);
  box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),inset 0 4px 0 rgba(255,255,255,.35),0 14px 26px color-mix(in srgb,var(--c) 35%,transparent);
  display:flex; flex-direction:column; gap:6px; transition:transform .12s}
@supports not (color:color-mix(in srgb,red 50%,blue)){.subj{background:linear-gradient(160deg,var(--c) 0%,var(--c) 62%);box-shadow:inset 0 -9px 0 var(--c),inset 0 4px 0 rgba(255,255,255,.35),0 14px 26px transparent}}
.subj:active{transform:scale(.97) translateY(3px)}
.subj-img{position:absolute; right:-8px; top:-30px; width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 8px 6px rgba(0,0,0,.18)); transition:transform .25s}
.subj:hover .subj-img{transform:rotate(-6deg) scale(1.05)}
.subj-name{font-family:var(--f-display); font-weight:800; font-size:2.1rem; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.14); padding-right:120px}
.subj-blurb{font-size:1rem; line-height:1.3; padding-right:110px; opacity:.96; flex:1}
.subj-prog{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.bar{flex:1; height:14px; border-radius:8px; background:rgba(0,0,0,.18); overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.bar i{display:block; height:100%; min-width:14px; background:linear-gradient(180deg,#FFE27A,var(--star)); border-radius:8px; transition:width 1.2s cubic-bezier(.3,1.1,.5,1) .15s}
.subj-prog b{font-weight:800; font-variant-numeric:tabular-nums}
.subj-prog .st{color:#FFE27A; text-shadow:0 2px 0 rgba(0,0,0,.2); font-size:1.25rem; margin-left:-6px}
.subj-prog.grow b,.subj-prog.grow .st{display:inline-block; animation:bounce .6s .9s}
.subj-prog.full .bar i{background:linear-gradient(90deg,#FFE27A,#FFF6C9,#FFB400,#FFE27A); background-size:300% 100%; animation:gold 3s linear infinite}
@keyframes gold{to{background-position:-300% 0}}
.subj-cup{position:absolute; left:-12px; top:-22px; font-size:2.6rem; line-height:1; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25)); animation:float 3s ease-in-out infinite}
.coin.pop{animation:bounce .6s}
.coin.pop::before{animation:starpop2 .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes starpop2{50%{transform:scale(1.5) rotate(25deg)}}
.shelf{margin-top:34px}
.shelf-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.shelf-head h2{font-size:1.7rem}
.shelf-row{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; padding:16px 16px 22px; border-radius:var(--r);
  background:linear-gradient(180deg,color-mix(in srgb,#D9A066 32%,var(--card)),color-mix(in srgb,#C68A50 48%,var(--card)));
  box-shadow:inset 0 -12px 0 color-mix(in srgb,#8F5D2E 60%,var(--card)),0 10px 22px var(--shadow)}
@supports not (color:color-mix(in srgb,red 50%,blue)){.shelf-row{background:linear-gradient(180deg,var(--card),var(--card));box-shadow:inset 0 -12px 0 #8F5D2E,0 10px 22px var(--shadow)}}
.trophy{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; border:0; border-radius:20px; padding:12px 6px 10px; background:var(--card); box-shadow:inset 0 -5px 0 var(--line),0 4px 10px var(--shadow)}
.trophy:active{transform:translateY(3px) scale(.98)}
.trophy .cup{font-size:2.6rem; line-height:1; filter:grayscale(1) opacity(.3)}
.trophy img{position:absolute; right:2px; top:2px; width:44px; height:44px; object-fit:contain; filter:grayscale(1) opacity(.45)}
.trophy .t-name{font-family:var(--f-display); font-weight:800; font-size:.98rem; line-height:1.05; text-align:center; overflow-wrap:anywhere}
.trophy .t-sub{font-size:.85rem; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.trophy.own{background:linear-gradient(180deg,color-mix(in srgb,var(--star) 22%,var(--card)),var(--card)); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--star) 55%,var(--line)),0 0 0 3px var(--star),0 6px 14px var(--shadow)}
@supports not (color:color-mix(in srgb,red 50%,blue)){.trophy.own{background:linear-gradient(180deg,var(--card),var(--card));box-shadow:inset 0 -5px 0 var(--star),0 0 0 3px var(--star),0 6px 14px var(--shadow)}}
.trophy.own .cup{filter:drop-shadow(0 4px 3px rgba(0,0,0,.2)); animation:float 3s ease-in-out infinite}
.trophy.own img{filter:none}
.trophy.own .t-sub{color:var(--c)}
@media (max-width:860px){ .shelf-row{grid-template-columns:repeat(3,minmax(0,1fr))} }
.families{margin-top:30px; background:var(--card); border-radius:var(--r); padding:4px 22px; box-shadow:0 5px 0 var(--line),0 10px 22px var(--shadow)}
.families summary{font-family:var(--f-display); font-weight:800; font-size:1.25rem; padding-block:14px; cursor:pointer}
.families ul{margin:0 0 14px; padding-left:20px; max-width:72ch}
.families li{margin-bottom:6px}
.families p{max-width:72ch; color:var(--ink-soft)}
.banner{--c:var(--azul); position:relative; display:flex; align-items:center; gap:16px; min-height:150px; padding:20px 170px 20px 20px; margin:6px 0 24px; border-radius:var(--r); color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c) 65%); box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),0 14px 26px color-mix(in srgb,var(--c) 30%,transparent)}
@supports not (color:color-mix(in srgb,red 50%,blue)){.banner{background:linear-gradient(160deg,var(--c),var(--c) 65%);box-shadow:inset 0 -9px 0 var(--c),0 14px 26px transparent}}
.banner h1{font-size:clamp(2.2rem,6vw,3.2rem); text-shadow:0 3px 0 rgba(0,0,0,.15)}
.banner p{margin:2px 0 0; font-size:1.1rem; opacity:.95}
.banner img{position:absolute; right:6px; bottom:-6px; width:180px; height:180px; object-fit:contain; filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.banner .round{background:rgba(255,255,255,.92); color:#232A4D; box-shadow:0 4px 0 rgba(0,0,0,.15)}
.banner-txt{flex:1; min-width:0}
.banner-prog{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-top:10px; max-width:480px}
.banner-prog .subj-prog{flex:1; min-width:200px}
.cupbtn{min-height:46px; border:0; border-radius:999px; padding:4px 16px; background:#fff; color:#232A4D; font-family:var(--f-display); font-weight:800; font-size:1.05rem; box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 3px var(--star)}
.cupbtn:active{transform:translateY(3px)}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}

  const el=document.createElement(tag);

    const v=a[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);

    else el.setAttribute(k,v===true?'':v);

  return el;
}

/* una app puede traer sus propios personajes (APP.avatars: [clave, nombre, grupo opcional] → img/av-nombre.png, con el nombre sin tildes,

   los jugadores antiguos con un animal se siguen viendo bien */
const AVATARS=APP.avatars||AVATARS_ANIMALES, AVW=APP.avWord||'animal';
const AVN=Object.fromEntries([...AVATARS_ANIMALES,...AVATARS]);
const avEl=k=>AVN[k]?h('img',{src:'img/av-'+AVN[k].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,'-')+'.png',alt:AVN[k],draggable:'false'}):h('span',null,k||'🦊');

let DB={players:[],cur:null,sound:true,opt:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.players)) DB=Object.assign(DB,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function me(){return DB.players.find(p=>p.id===DB.cur)||null;}
const gmax=g=>(g&&g.max)||3;
function starsOf(p,id){return p?Math.min((p.stars&&p.stars[id])||0,gmax(GAMES[id])):0;}
function bestStars(id){return starsOf(me(),id);}
function subjProg(sid,p=me()){const gs=gamesOf(sid).filter(g=>!g.noStars);return {got:gs.reduce((a,g)=>a+starsOf(p,g.id),0),max:gs.reduce((a,g)=>a+gmax(g),0)};}
/* niveles: el 1 es el de siempre (cuenta para la barra y el trofeo); el 2 y el 3 son retos que se desbloquean con 2 ★ */
const LEVELS=[null,{n:1,ic:'🌱',tag:'Normal'},{n:2,ic:'🔥',tag:'Difícil'},{n:3,ic:'🚀',tag:'Experto'}];
const hasLevels=g=>!!g&&!g.noStars&&g.levels!==false;
const lvKey=(id,l)=>l>1?id+'@'+l:id;
const lvStars=(id,l,p=me())=>p?Math.min((p.stars&&p.stars[lvKey(id,l)])||0,gmax(GAMES[id])):0;
const lvOpen=(id,l,p=me())=>l===1||lvStars(id,l-1,p)>=2;
function subjRetos(sid,p=me()){const gs=gamesOf(sid).filter(hasLevels);return {got:gs.reduce((a,g)=>a+lvStars(g.id,2,p)+lvStars(g.id,3,p),0),max:gs.length*6};}
function lvProg(sid,l,p=me()){const gs=gamesOf(sid).filter(hasLevels);return {got:gs.reduce((a,g)=>a+lvStars(g.id,l,p),0),max:gs.reduce((a,g)=>a+gmax(g),0)};}
function totalStars(p=me()){return p?SUBJECTS.reduce((a,s)=>a+subjProg(s.id,p).got+subjRetos(s.id,p).got,0):0;}
function setStars(id,n){const p=me(); if(!p) return; p.stars=p.stars||{}; if(n>(p.stars[id]||0)) p.stars[id]=n; save();}
/* trofeos: uno por nivel en cada asignatura (todas las estrellas de ese nivel); «Leer cada día» solo tiene el primero */
const TROPHY=[null,{name:'Trofeo',ic:'🏆',vid:null},{name:'Trofeo de fuego',ic:'🔥',vid:'fuego'},{name:'Trofeo galáctico',ic:'🚀',vid:'cohete'}];
const tLevels=sid=>gamesOf(sid).some(hasLevels)?[1,2,3]:[1];
const tKey=(sid,l=1)=>l>1?sid+'@'+l:sid;
const tProg=(sid,l=1,p=me())=>l>1?lvProg(sid,l,p):subjProg(sid,p);
const hasTrophy=(sid,p=me(),l=1)=>!!(p&&p.trophies&&p.trophies.includes(tKey(sid,l)));
const dueTrophy=(sid,l=1)=>{const p=me(),sp=tProg(sid,l);return !!(p&&sp.max&&sp.got>=sp.max&&!hasTrophy(sid,p,l));};
function earnTrophy(sid,l=1){const p=me(),sp=tProg(sid,l); if(!p||!sp.max||sp.got<sp.max||hasTrophy(sid,p,l)) return false; p.trophies=[...(p.trophies||[]),tKey(sid,l)]; save(); return true;}

.64],"¿Cuánto tiempo hay que dejarlo cubierto de natrón?":[1,38.34,2.38],"La primera pirámide de Egipto parece una escalera gigante de seis escalones. La ideó un sabio llamado Imhotep.":[2,0.3,6.5],"Hay una pirámide torcida: a mitad de la obra cambiaron la inclinación. Se cree que fue para que no se viniera abajo.":[2,7.1,6.58],"La Gran Pirámide tiene más de dos millones de bloques de piedra. Cada uno pesa, más o menos, como dos coches.":[2,13.98,6.28],"Arrastraban las piedras en trineos y mojaban la arena de delante: así el trineo resbalaba mucho mejor.":[2,20.56,6.14],"Para hacer una momia cubrían el cuerpo con una sal, el natrón, durante cuarenta días. Todo el trabajo duraba setenta días.":[2,27.0,7.4],"El hígado, los pulmones, el estómago y los intestinos de la momia se guardaban en cuatro vasos, cada uno con una cabeza distinta.":[2,34.7,7.6],"Sobre el corazón de la momia ponían un escarabajo de piedra con un conjuro, para que el corazón no contara sus secretos a los dioses.":[2,42.6,7.42],"Los egipcios también hacían momias de animales: gatos, perros, pájaros y ¡hasta cocodrilos!":[2,50.32,6.4],"Durante más de mil años nadie supo leer los jeroglíficos. Una piedra con el mismo texto en tres escrituras ayudó a descifrarlos.":[2,57.02,7.88],"Los nombres de los faraones se escribían dentro de un óvalo, el cartucho. El de Keops tiene solo cuatro signos y en egipcio sonaba Jufu.":[2,65.2,8.54],"Los egipcios casi nunca escribían las vocales. Y podían escribir hacia la derecha, hacia la izquierda o hacia abajo.":[2,74.04,6.74],"La máscara de Tutankamón es de oro y pesa unos diez kilos. El faraón tenía solo unos diecinueve años cuando murió.":[2,81.08,7.0],"En muchas tumbas hay una puerta de piedra que no se abre. Creían que por ella salía el espíritu del muerto a recoger su comida.":[2,88.38,7.12],"Cada verano el Nilo se desbordaba y dejaba un barro negro buenísimo para sembrar. Por eso los egipcios llamaban a su país la tierra negra.":[2,95.8,8.16],"A la Gran Esfinge  bloques iban en trineos y en barcos por el Nilo.":[5,27.4,6.54],"El faraón Keops pagó a cada obrero de su pirámide con monedas de oro.":[5,34.24,3.98],"Las monedas se inventaron casi dos mil años después. A los obreros se les pagaba con pan y otros alimentos.":[5,38.52,6.16],"Visita la Gran Pirámide y verás dentro la tumba de Tutankamón.":[5,44.98,3.44],"La Gran Pirámide es la tumba de Keops. Tutankamón vivió más de mil años después y lo enterraron en el Valle de los Reyes.":[5,48.72,7.0],"Para cortar las piedras de la pirámide, los obreros usaban sierras y picos de hierro.":[5,56.02,4.64],"En tiempos de las pirámides trabajaban con cinceles de cobre y mazas de piedra. Las herramientas de hierro llegaron mucho después.":[5,60.96,7.2],"¡Hola! ¿A qué época viajamos hoy? Elige un lugar.":[6,0.3,3.8],"Este es tu museo. Cada vez que acabas un juego, ganas una pieza con su curiosidad.":[6,4.4,4.88],"Detrás de esta puerta están los vikingos. ¡Muy pronto podrás entrar!":[6,9.58,3.76],"Detrás de esta puerta están los castillos y los caballeros. ¡Muy pronto podrás entrar!":[6,13.64,4.72],"Detrás de esta puerta están los piratas y los exploradores. ¡Muy pronto podrás entrar!":[6,18.66,4.94],"Detrás de esta puerta están los grandes inventos. ¡Muy pronto podrás entrar!":[6,23.9,4.38],"Prehistoria":[6,28.58,0.92],"Egipto":[6,29.8,0.76],"Grecia":[6,30.86,0.78],"Roma":[6,31.94,0.72],"¡Enhorabuena! ¡Has conseguido todas las estrellas de Prehistoria! ¡Aquí tienes tu trofeo!":[6,32.96,5.34],"¡Increíble! ¡Has conseguido todas las estrellas del nivel difícil de Prehistoria! ¡Aquí tienes tu trofeo de fuego!":[6,38.6,6.7],"¡Nivel experto superado! ¡Has conseguido todas las estrellas del nivel experto de Prehistoria! ¡Aquí tienes tu trofeo galáctico!":[6,45.6,7.56],"¡Enhorabuena! ¡Has conseguido todas las estrellas de Egipto! ¡Aquí tienes tu trofeo!":[6,53.46,5.18],"¡Increíble! ¡Has conseguido todas las estrellas del nivel difícil de Egipto! ¡Aquí tienes tu trofeo de fuego!":[6,58.94,6.66],"¡Nivel experto superado! ¡Has conseguido todas las estrellas del nivel experto de Egipto! ¡Aquí tienes tu trofeo galáctico!":[6,65.9,7.5],"¡Enhorabuena! ¡Has conseguido todas las estrellas de Grecia! ¡Aquí tienes tu trofeo!":[6,73.7,5.28],"¡Increíble! ¡Has conseguido todas las estrellas del nivel difícil de Grecia! ¡Aquí tienes tu trofeo de fuego!":[6,79.28,6.72],"¡Nivel experto superado! ¡Has conseguido todas las estrellas del nivel experto de Grecia! ¡Aquí tienes tu trofeo galáctico!":[6,86.3,7.46],"¡Enhorabuena! ¡Has conseguido todas las estrellas de Roma! ¡Aquí tienes tu trofeo!":[6,94.06,5.12],"¡Increíble! ¡Has conseguido todas las estrellas del nivel difícil de Roma! ¡Aquí tienes tu trofeo de fuego!":[6,99.48,6.58],"¡Nivel experto superado! ¡Has conseguido todas las estrellas del nivel experto de Roma! ¡Aquí tienes tu trofeo galáctico!":[6,106.36,7.128],"¿Qué necesita Mochi?":[7,0.3,1.28],"Para conseguirlo hacen falta dos cosas. Tócalas.":[7,1.88,3.6],"Ordena los momentos: toca primero el más antiguo. Escucha las pistas: cada una te dice algo de otro momento.":[7,5.78,8.18],"Ordena los momentos, del más antiguo al más moderno. Esta vez no hay pistas.":[7,14.26,5.24],"Coloca cada tarjeta en su sitio de la regla del tiempo: toca una tarjeta y después su sitio.":[7,19.8,5.62],"¡Bien colocado! Ahora piensa.":[7,25.72,2.54],"Aquí hay una cosa que no es de esta época. Tócala.":[7,28.56,3.18],"Aquí hay dos cosas que no son de esta época. Encuéntralas.":[7,32.04,3.52],"¡Bien! Todavía queda otra cosa que no es de esta época.":[7,35.86,3.66],"¿En qué época estamos?":[7,39.82,1.36],"¿Pudo pasar?":[7,41.48,0.9],"¿Qué nos dice esta pista?":[7,42.68,1.5],"Junta las tres pistas. ¿Quién vivió aquí?":[7,44.48,2.88],"Mira las capas de tierra. La de abajo es la más antigua.":[7,47.66,3.46],"¿Para qué servía?":[7,51.42,1.0],"La línea del tiempo":[7,52.72,1.32],"¿Quién se ha colado?":[7,54.34,1.22],"Detectives de la cueva":[7,55.86,1.436],"Hace muchísimo frío y quiero coser unas pieles para hacerme un abrigo.":[8,0.3,4.2],"Con agujas de hueso cosían las pieles para hacerse ropa de abrigo.":[8,4.8,3.52],"Quiero pescar salmones en el río.":[8,8.62,1.78],"El arpón, hecho de hueso o de asta, tenía dientes para que el pez no se escapara.":[8,10.7,5.02],"Voy a pintar al fondo de la cueva, donde no llega la luz del sol.":[8,16.02,3.48],"Con lámparas de grasa alumbraban el fondo de las cuevas para pintar.":[8,19.8,3.52],"Hemos cazado un bisonte y hay que cortar la carne.":[8,23.62,2.8],"El bifaz era una piedra tallada a golpes, con filo para cortar.":[8,26.72,3.76],"Quiero cazar un ciervo sin acercarme demasiado.":[8,30.78,2.34],"Con el arco, la flecha llegaba lejos y el cazador no tenía que acercarse.":[8,33.42,4.22],"Es de noche, hace frío y se oyen lobos cerca.":[8,37.94,3.3],"El fuego daba calor y luz, y los animales no se acercaban.":[8,41.54,3.42],"Quiero pintar un bisonte rojo en la pared.":[8,45.26,2.12],"El ocre es una tierra roja. Machacada y mezclada con agua, era su pintura.":[8,47.68,4.92],"Esta piel tiene todavía grasa pegada y hay que dejarla limpia.":[8,52.9,3.54],"Con el raspador de piedra limpiaban las pieles antes de coserlas.":[8,56.74,3.42],"Hoy hay fiesta en el clan y quiero ponerme guapa.":[8,60.46,2.6],"Ya en el Paleolítico se adornaban con collares de conchas y de dientes.":[8,63.36,3.82],"Vamos detrás de los renos y por aquí no hay ninguna cueva. ¿Dónde dormimos?":[8,67.48,4.46],"No siempre vivían en cuevas: montaban cabañas con ramas, huesos y pieles.":[8,72.24,4.393],"En el poblado queremos hacer pan.":[8,76.933,1.92],"Con la hoz se siega el trigo y con la piedra de moler se hace la harina.":[8,79.153,3.84],"Quiero un vestido de lana.":[8,83.293,1.4],"La oveja da la lana y en el telar se teje.":[8,84.993,2.66],"Hay que guardar el grano todo el invierno sin que se moje.":[8,87.953,2.88],"Con barro se da forma a la vasija y con fuego se cuece para que quede dura.":[8,91.133,4.06],"Vamos a construir una cabaña en el poblado.":[8,95.493,2.36],"Con el hacha de piedra pulida cortaban los troncos, y tapaban las paredes con barro y paja.":[8,98.153,5.06],"El herrero va a hacer una espada de bronce.":[8,103.513,2.14],"El bronce se hace fundiendo cobre y estaño en un horno muy caliente.":[8,105.953,3.78],"Queremos sembrar un campo de trigo.":[8,110.033,1.84],"Con la azada se remueve la tierra y después se echan las semillas guardadas de la cosecha anterior.":[8,112.173,5.22],"Hay que llevar toda la cosecha al poblado vecino.":[8,117.693,2.58],"Los bueyes tiran del carro con ruedas: así se lleva mucha carga de una vez.":[8,120.573,4.2],"Quiero leche fresca cada mañana y un sitio donde guardarla.":[8,125.073,3.32],"Criaban cabras para tener leche y la guardaban en vasijas de barro.":[8,128.693,3.8],"Queremos cruzar el mar para cambiar nuestro metal por joyas.":[8,132.793,3.2],"En la Edad de los Metales iban en barco a cambiar metales por otras cosas.":[8,136.293,4.08],"Los lobos se comen nuestras ovejas por la noche.":[8,140.673,2.6],"El perro vigila el rebaño y el corral lo guarda por la noche.":[8,143.573,3.309],"Cuando aprendieron a cultivar, ya no tenían que ir detrás de los animales. ¿Qué cambió en su vida?":[8,147.182,5.12],"Quien siembra tiene que quedarse a cuidar el campo y esperar la cosecha: por eso nacieron los poblados.":[8,152.602,5.46],"¿Por qué los cazadores nómadas no usaban vasijas de barro?":[8,158.362,2.98],"Las vasijas pesan y se rompen con facilidad: son para gente que vive siempre en el mismo sitio.":[8,161.642,5.24],"¿Por qué el metal era mejor que la piedra para hacer herramientas?":[8,167.182,3.02],"Una piedra rota ya no sirve. El metal se funde otra vez y se hace una herramienta nueva.":[8,170.502,5.18],"Un poblado tiene trigo de sobra y otro tiene muchas vasijas. No existe el dinero. ¿Qué pueden hacer?":[8,175.982,5.98],"Cambiar unas cosas por otras se llama trueque. Así empezó el comercio.":[8,182.262,4.18],"El cartel de un museo dice: «Con esta hoz, los cazadores del Paleolítico segaban el trigo». ¿Dónde está el error?":[8,186.742,7.2],"La hoz llegó con los primeros agricultores, en el Neolítico.":[8,194.242,3.6],"El cartel de un museo dice: «Esta espada de bronce es la herramienta más antigua del mundo». ¿Dónde está el error?":[8,198.142,7.22],"Las primeras herramientas, de piedra, tienen unos 3 millones de años. Los metales, solo unos 7.000.":[8,205.662,6.58],"¿Por qué decimos que la Prehistoria termina cuando se inventa la escritura?":[8,212.542,3.64],"De antes de la escritura solo tenemos objetos, huesos y pinturas. Desde la escritura, también lo que la gente dejó escrito.":[8,216.482,7.28],"Con el fuego podían calentarse. ¿Qué más cambió gracias al fuego?":[8,224.062,3.9],"El fuego dio comida cocinada, luz y protección. Los metales llegaron muchísimo después.":[8,228.262,5.88],"En el Neolítico había más comida que antes. ¿Qué pasó con los poblados?":[8,234.442,4.1],"Con las cosechas y los rebaños se podía dar de comer a más personas: los poblados crecieron.":[8,238.842,5.22],"Antes de la rueda, las cosas pesadas se llevaban a cuestas o arrastrándolas. ¿Qué cambió con el carro?":[8,244.362,5.72],"Un carro tirado por bueyes lleva lo que no podrían cargar muchas personas juntas.":[8,250.382,4.4],"Las primeras herramientas de piedra":[9,0.3,1.92],"Las primeras herramientas de piedra: hace unos 3 millones de años.":[9,2.52,3.84],"Aprenden a encender fuego":[9,6.66,1.68],"El fuego: hace unos 400.000 años ya sabían encenderlo.":[9,8.64,4.04],"Los bisontes de Altamira":[9,12.98,1.58],"Los bisontes de Altamira: hace unos 15.000 años.":[9,14.86,3.14],"Los primeros cultivos":[9,18.3,1.52],"Los primeros cultivos: hace unos 10.000 años.":[9,20.12,2.98],"Los primeros metales":[9,23.4,1.5],"Los primeros metales: hace unos 7.000 años.":[9,25.2,3.06],"La rueda":[9,28.56,0.8],"La rueda: hace unos 5.500 años.":[9,29.66,2.96],"La escritura":[9,32.92,1.02],"La escritura: hace algo más de 5.000 años.":[9,34.24,3.02],"Fue lo primero: antes no había ninguna herramienta.":[9,37.56,2.82],"Llegó mucho después de las primeras herramientas.":[9,40.68,2.76],"Los pintores ya se alumbraban con fuego.":[9,43.74,2.24],"Es lo más moderno de todo.":[9,46.28,1.586],"Antes de esto no había herramientas.":[9,48.166,2.0],"Los pintaron cazadores, antes de que nadie cultivara.":[9,50.466,2.8],"Empezaron después de pintarse las cuevas.":[9,53.566,2.12],"Los fundió gente que ya cultivaba.":[9,55.986,1.96],"Lo encendían cazadores, mucho antes de que hubiera cultivos.":[9,58.246,3.34],"Llegaron mucho después del fuego.":[9,61.886,1.78],"Llegaron después de los cultivos.":[9,63.966,1.84],"Se inventó cuando ya se usaban los metales.":[9,66.106,2.3],"Es lo más antiguo de todo.":[9,68.706,1.56],"Llegó después de las herramientas de piedra.":[9,70.566,2.1],"Con ellos nacieron los poblados, mucho después del fuego.":[9,72.966,3.18],"Se inventó cuando ya había poblados y cultivos.":[9,76.446,2.58],"Cuando se pintaron, nadie cultivaba todavía.":[9,79.326,2.54],"Empezaron antes de que hubiera metales.":[9,82.166,2.08],"Llegaron antes que la rueda.":[9,84.546,1.54],"Es lo más moderno de esta lista.":[9,86.386,1.76],"Es lo más antiguo de esta lista.":[9,88.446,1.86],"Se pintaron a la luz del fuego.":[9,90.606,1.709],"Llegaron mucho después de las pinturas.":[9,92.616,2.1],"Es lo último: con ella se acaba la Prehistoria.":[9,95.016,3.02],"¿Cuánto tiempo vivieron las personas sin saber escribir?":[9,98.336,2.9],"De las primeras herramientas a la escritura pasaron casi 3 millones de años. La escritura es muy reciente.":[9,101.536,6.46],"¿Tenían un huerto los pintores de Altamira?":[9,108.296,2.16],"Los bisontes de Altamira se pintaron hace unos 15.000 años, y los primeros cultivos son de hace unos 10.000.":[9,110.756,5.94],"¿Vio alguna persona de la Prehistoria un Tiranosaurio rex vivo?":[9,116.996,3.56],"El Tiranosaurio rex desapareció hace 66 millones de años. Las primeras herramientas son de hace unos 3 millones.":[9,120.856,7.42],"Si todo el tiempo desde las primeras herramientas hasta hoy cupiera en un solo día, ¿cuándo empezarían a cultivar?":[9,128.576,6.2],"Casi todo ese día fueron cazadores. Cultivar es un invento de los últimos cinco minutos.":[9,135.076,5.44],"¿Podía un niño de los primeros poblados escribir su nombre?":[9,140.816,3.08],"Los primeros cultivos son de hace unos 10.000 años, y la escritura, de hace algo más de 5.000.":[9,144.196,5.22],"¿Cuánto tiempo usaron herramientas de piedra antes de saber encender fuego?":[9,149.716,3.88],"De las primeras herramientas, hace unos 3 millones de años, al fuego, hace unos 400.000, pasaron más de dos millones de años.":[9,153.896,8.0],"¿Qué es más antiguo: los bisontes de Altamira o la escritura?":[9,162.196,3.56],"Los bisontes se pintaron hace unos 15.000 años. La escritura tiene algo más de 5.000.":[9,166.056,5.04],"¿Qué duró más: la vida de cazadores o la vida de agricultores?":[9,171.396,3.48],"Fueron cazadores durante millones de años. Agricultores, solo desde hace unos 10.000.":[9,175.176,5.224],"Esto es un campamento de cazadores del Paleolítico.":[10,0.3,2.84],"Esto es un poblado del Neolítico.":[10,3.44,1.84],"Esto es un poblado de la Edad de los Metales.":[10,5.58,2.24],"Las gafas se inventaron hace unos setecientos años.":[10,8.12,2.8],"En la Prehistoria no había libros: todavía no existía la escritura.":[10,11.22,3.4],"Los relojes llegaron muchísimo después. En la Prehistoria miraban el sol.":[10,14.92,4.14],"La bombilla eléctrica tiene unos ciento cincuenta años.":[10,19.36,3.06],"Las monedas se inventaron mucho después. En la Prehistoria se cambiaban unas cosas por otras.":[10,22.72,5.1],"La bicicleta se inventó hace unos doscientos años.":[10,28.12,2.76],"El lápiz se inventó hace menos de quinientos años.":[10,31.18,2.76],"Los castillos son de la Edad Media, miles de años después.":[10,34.24,3.34],"Las vasijas de barro llegaron en el Neolítico. Los cazadores nómadas no cargaban con ellas.":[10,37.88,5.92],"En el Paleolítico no había rebaños. Las ovejas se empezaron a criar en el Neolítico.":[10,44.1,4.72],"La hoz es para segar el trigo, y en el Paleolítico nadie cultivaba.":[10,49.12,3.754],"El telar es del Neolítico. En el Paleolítico se vestían con pieles cosidas.":[10,53.174,4.44],"Las espadas son de metal: llegaron en la Edad de los Metales.":[10,57.914,3.5],"La rueda y el carro llegaron después, en la Edad de los Metales.":[10,61.714,3.44],"Durante mucho tiempo los caballos solo se cazaban. Se empezaron a montar después, en la Edad de los Metales.":[10,65.454,6.0],"Los dinosaurios gigantes desaparecieron millones de años antes de que hubiera personas.":[10,71.754,4.46],"¿Por qué no puede haber un dinosaurio gigante en un campamento de cazadores?":[10,76.514,3.66],"¿Por qué no usaban vasijas los cazadores del Paleolítico?":[10,80.474,3.0],"¿Por qué no hay rebaños de ovejas en un campamento del Paleolítico?":[10,83.774,3.3],"¿Para qué querría una hoz un cazador del Paleolítico?":[10,87.374,2.8],"¿Por qué no hay espadas antes de la Edad de los Metales?":[10,90.474,2.6],"¿Por qué no hay carros en un poblado del Neolítico?":[10,93.374,2.46],"¿Por qué nadie monta a caballo en un poblado del Neolítico?":[10,96.134,2.96],"¿Por qué no hay libros en la Prehistoria?":[10,99.394,1.86],"Sin monedas, ¿cómo conseguían lo que no tenían?":[10,101.554,2.633],"Un grupo de cazadores sigue a una manada de renos.":[11,0.3,2.72],"En el Paleolítico vivían de cazar y de recoger frutos, e iban detrás de los animales.":[11,3.32,4.78],"Alguien pinta un bisonte en la pared de una cueva, a la luz de una lámpara de grasa.":[11,8.4,4.48],"Las pinturas de las cuevas, como las de Altamira, son del Paleolítico.":[11,13.18,3.86],"Una familia siembra trigo junto a su cabaña.":[11,17.34,2.6],"En el Neolítico aprendieron a cultivar y se quedaron a vivir en poblados.":[11,20.24,3.96],"Un niño lleva las ovejas al corral.":[11,24.5,2.08],"En el Neolítico empezaron a criar ovejas, cabras, vacas y cerdos.":[11,26.88,4.16],"Un herrero echa metal fundido en un molde.":[11,31.34,2.56],"Fundir metales para hacer herramientas es de la Edad de los Metales.":[11,34.2,3.5],"Dos bueyes tiran de un carro con ruedas.":[11,38.0,2.42],"La rueda y el carro llegaron en la Edad de los Metales.":[11,40.72,2.88],"Alguien talla una piedra a golpes para hacer un bifaz.":[11,43.9,2.74],"Las herramientas de piedra tallada a golpes son del Paleolítico.":[11,46.94,3.64],"Una mujer da forma a una vasija de barro.":[11,50.88,2.44],"Las vasijas de barro llegaron con el Neolítico: servían para guardar el grano y para cocinar.":[11,53.62,5.08],"Un poblado está rodeado por una gran muralla de piedra, y dentro hay un taller de metal.":[11,59.0,4.96],"En la Edad de los Metales los poblados crecieron y se protegieron con murallas.":[11,64.26,3.96],"Tejen una tela de lino en un telar.":[11,68.52,1.94],"En el Neolítico aprendieron a hilar y a tejer.":[11,70.76,2.46],"Hay campos de trigo y ovejas, pero todas las herramientas son de piedra y de hueso.":[11,73.52,4.6],"Cultivan y crían animales, pero aún no conocen los metales: es el Neolítico.":[11,78.42,5.02],"Hay campos de trigo y ovejas, y el jefe lleva un puñal de cobre.":[11,83.74,3.86],"El trigo y las ovejas siguen ahí, pero el cobre nos dice que ya es la Edad de los Metales.":[11,87.9,5.02],"Visten pieles cosidas, cazan mamuts y nunca se quedan mucho tiempo en el mismo sitio.":[11,93.22,4.92],"Cazadores que van de un sitio a otro: es el Paleolítico.":[11,98.44,3.52],"Hay vasijas de barro y hachas de piedra pulida, y nadie ha visto nunca una rueda.":[11,102.26,4.34],"Cerámica y piedra pulida, sin rueda ni metales: es el Neolítico.":[11,106.9,4.46],"Cazan ciervos con arcos, pero también llevan espadas de bronce.":[11,111.66,3.54],"Cazar, se cazó siempre. Lo más moderno, el bronce, nos dice la época: la Edad de los Metales.":[11,115.5,7.02],"Tienen fuego y agujas de hueso, pero no cultivan ni tienen rebaños.":[11,122.82,4.06],"Sin cultivos ni rebaños, viven de cazar y recoger: es el Paleolítico.":[11,127.18,4.82],"Levantan un dolmen con piedras enormes y viven de sus cultivos. Todavía no funden metales.":[11,132.3,5.52],"Los grandes dólmenes, como el de Menga, en Antequera, los levantaron agricultores del Neolítico, que todavía no usaban metales.":[11,138.12,7.14],"Un barco de vela llega con estaño para cambiarlo por joyas.":[11,145.56,3.24],"Llevar metales en barco para cambiarlos es de la Edad de los Metales.":[11,149.1,3.7],"Pintan ciervos y caballos en la cueva, y con ellos va un perro.":[11,153.1,3.54],"El perro ya vivía con los cazadores del Paleolítico: fue el primer animal doméstico.":[11,156.94,4.72],"Muelen el trigo con una piedra y guardan la harina en vasijas. No hay ni un objeto de metal.":[11,161.96,5.4],"Harina y vasijas, pero ningún metal: es el Neolítico.":[11,167.66,3.7],"Una niña del Paleolítico juega con su perro.":[11,171.66,2.58],"El perro ya acompañaba a los cazadores del Paleolítico, mucho antes de que hubiera ovejas o vacas.":[11,174.54,5.4],"Un cazador del Paleolítico guarda agua en una vasija de barro.":[11,180.24,3.34],"Un pastor del Neolítico se encuentra con un dinosaurio gigante.":[11,183.88,3.36],"Una familia del Neolítico come pan con queso.":[11,187.54,2.68],"En el Neolítico ya había trigo para el pan y leche de cabra y de oveja para el queso.":[11,190.52,4.42],"Un cazador del Paleolítico persigue a los bisontes montado a caballo.":[11,195.24,3.74],"En el Paleolítico cazaban caballos y los pintaban en las cuevas, pero no los montaban.":[11,199.28,4.726],"Un grupo de cazadores del Paleolítico vive toda la vida en la misma cueva.":[11,204.306,3.9],"Los cazadores cambiaban de sitio con las estaciones, siguiendo a los animales.":[11,208.506,3.84],"En un poblado del Neolítico tejen una tela en un telar.":[11,212.646,3.04],"En la Edad de los Metales, un poblado cambia espadas por trigo.":[11,215.986,3.36],"Sin monedas, el comercio se hacía cambiando unas cosas por otras: el trueque.":[11,219.646,4.5],"Un neandertal y una persona como nosotros se encuentran en Europa.":[11,224.446,3.5],"Los neandertales vivieron en Europa hasta hace unos 40.000 años, y durante miles de años compartieron tierras con personas como nosotros.":[11,228.246,7.62],"Un agricultor del Neolítico siega el trigo con una hoz de hierro.":[11,236.166,3.5],"Su hoz era de madera con dientes de piedra afilada. El hierro llegó miles de años después.":[11,239.966,5.48],"Unos cazadores del Paleolítico cazan un mamut.":[11,245.746,2.74],"Los mamuts vivieron en la era glacial, junto a los cazadores del Paleolítico.":[11,248.786,4.04],"Los constructores de un dolmen mueven piedras enormes sin grúas ni camiones.":[11,253.126,4.16],"El dolmen de Menga, en Antequera, tiene una piedra de unas ciento cincuenta toneladas. Lo levantaron hace casi 6.000 años.":[11,257.586,7.118],"En el suelo de la cueva hay un círculo de piedras con ceniza y huesos quemados.":[12,0.3,4.08],"La ceniza y los huesos quemados dentro de un círculo de piedras son los restos de una hoguera.":[12,4.68,4.78],"Hemos encontrado varias agujas de hueso muy finas.":[12,9.76,2.94],"Con agujas tan finas cosían pieles para hacer ropa ajustada y abrigada.":[12,13.0,3.92],"Lejos del mar, en una cueva de montaña, hay conchas marinas con un agujerito.":[12,17.22,4.58],"Las conchas con agujero eran adornos. Si están lejos del mar, alguien las llevó hasta allí o las cambió por otra cosa.":[12,22.1,6.94],"Junto a una cabaña hay granos de trigo quemados y una piedra de moler.":[12,29.34,3.5],"El trigo y la piedra de moler son pistas de agricultores.":[12,33.14,3.1],"Hay huesos de mamut con cortes hechos por una piedra afilada.":[12,36.54,3.3],"Las marcas de corte en los huesos nos dicen que alguien quitó la carne con un filo de piedra.":[12,40.14,4.44],"En la pared hay manos pintadas: unas grandes y otras muy pequeñas.":[12,44.88,3.96],"Las manos pequeñas son de niños: ellos también entraban en la cueva y dejaban su huella.":[12,49.14,4.74],"En el basurero del poblado, casi todos los huesos son de oveja y de cabra.":[12,54.18,3.96],"Tantos huesos de oveja y de cabra son la pista de un poblado de ganaderos.":[12,58.44,3.82],"Hay un molde de piedra con forma de hacha y gotas de metal por el suelo.":[12,62.56,3.64],"El molde y las gotas de metal son los restos de un taller de la Edad de los Metales.":[12,66.5,4.16],"Hay una persona enterrada con cuidado, con un collar y sus herramientas al lado.":[12,70.96,4.18],"Enterrar a alguien con sus adornos y sus cosas nos dice que lo querían y lo despedían.":[12,75.44,4.46],"El suelo está lleno de trocitos de piedra afilados y hay un bifaz a medio hacer.":[12,80.2,4.24],"Al tallar una piedra saltan muchos trocitos. Donde hay tantos, hubo un taller.":[12,84.74,4.74],"Huesos de reno con marcas de corte":[12,89.78,2.12],"Un arpón de asta":[12,92.2,1.28],"Ningún grano de trigo":[12,93.78,1.38],"Cazaban y pescaban, y no cultivaban: eran cazadores del Paleolítico.":[12,95.46,4.46],"Granos de trigo":[12,100.22,1.14],"Trozos de vasijas de barro":[12,101.66,1.6],"Ni un solo objeto de metal":[12,103.56,1.66],"Cultivaban y hacían vasijas, pero aún no conocían el metal: eran agricultores del Neolítico.":[12,105.52,5.84],"Un puñal de cobre":[12,111.66,1.3],"El trigo y las vasijas siguen ahí, pero el puñal de cobre nos dice que ya es la Edad de los Metales.":[12,113.26,5.44],"Bisontes pintados en la pared":[12,119.0,1.8],"Una lámpara de grasa":[12,121.1,1.38],"Agujas de hueso":[12,122.78,1.22],"Pinturas en la cueva, lámparas de grasa y agujas de hueso: cazadores del Paleolítico.":[12,124.3,5.14],"Un hacha de piedra pulida":[12,129.74,1.56],"Huesos de oveja":[12,131.6,1.14],"Los agujeros de los postes de una cabaña":[12,133.04,2.22],"Piedra pulida, rebaños y cabañas fijas: un poblado del Neolítico.":[12,135.56,4.5],"Una muralla de piedra":[12,140.36,1.3],"Un molde para hacer hachas":[12,141.96,1.62],"La rueda de un carro":[12,143.88,1.32],"Murallas, moldes para fundir y ruedas: la Edad de los Metales.":[12,145.5,4.2],"Puntas de flecha de piedra":[12,150.0,1.56],"Huesos de ciervo":[12,151.86,1.22],"Una espada de bronce":[12,153.38,1.3],"Siguieron cazando ciervos, pero la espada de bronce nos da la época: la Edad de los Metales.":[12,154.98,5.18],"Los restos de una hoguera":[12,160.46,1.52],"Un bifaz":[12,162.28,0.78],"Huesos de mamut":[12,163.36,1.14],"Fuego, piedra tallada y mamuts: cazadores del Paleolítico.":[12,164.8,3.92],"Una piedra de moler":[12,169.02,1.2],"Las pesas de un telar":[12,170.52,1.34],"Herramientas solo de piedra y de hueso":[12,172.16,2.14],"Molían grano y tejían, y todas sus herramientas eran de piedra y de hueso: el Neolítico.":[12,174.6,5.289],"Un dolmen de piedras enormes":[12,180.189,1.8],"Granos de cebada":[12,182.289,1.18],"Ningún metal":[12,183.769,1.06],"Los dólmenes los empezaron a levantar agricultores del Neolítico, antes de conocer los metales.":[12,185.129,5.54],"¿Quién vivió primero en esta cueva?":[12,190.969,1.7],"La capa de abajo es la más antigua: primero estuvieron los cazadores del bifaz.":[12,192.969,4.24],"Entre la capa de los cazadores y la de los agricultores hay una capa sin nada. ¿Qué pudo pasar?":[12,197.509,5.98],"Una capa sin restos quiere decir que la cueva estuvo vacía durante un tiempo.":[12,203.789,4.02],"Abajo hay huesos de reno; arriba, huesos de oveja. ¿Qué cambió?":[12,208.109,4.4],"Abajo, lo más antiguo: cazadores de renos. Arriba, lo más moderno: pastores con ovejas.":[12,212.809,6.08],"En la capa de los cazadores ha aparecido una moneda. ¿Qué piensa una buena detective?":[12,219.189,5.12],"Las monedas llegaron miles de años después. Un hoyo o la madriguera de un animal pueden bajar cosas a capas más antiguas.":[12,224.609,7.2],"Según las capas, ¿en qué orden se inventaron estas herramientas?":[12,232.109,3.44],"De abajo arriba: piedra tallada, piedra pulida y metal. Así fueron cambiando las herramientas.":[12,235.849,7.0],"Los arqueólogos quieren encontrar lo más antiguo de la cueva. ¿Dónde tienen que excavar?":[12,243.149,4.78],"Cuanto más abajo, más antiguo. En Atapuerca, en Burgos, excavando muy hondo han encontrado restos de personas de hace más de un millón de años.":[12,248.229,9.1],"En la capa de abajo hay herramientas, pero ni rastro de fuego. En la de en medio ya hay hogueras. ¿Qué nos cuenta?":[12,257.629,6.98],"Las capas cuentan la historia en orden: abajo, sin fuego; más arriba, con hogueras.":[12,264.909,5.42],"Pinta el bisonte con ocre rojo. Rellénalo bien, sin salirte mucho.":[13,0.3,4.06],"Primero, el contorno con carbón. Después, rellena con ocre rojo. Y al final, deja dos manos sopladas.":[13,4.66,7.18],"La cueva está oscura: tu lámpara alumbra donde pintas. Mira bien el ciervo, que enseguida se esconde.":[13,12.14,6.02],"Apoya la mano en la roca y no la muevas: Mochi sopla la pintura.":[13,18.46,4.06],"Frota muy rápido, de un lado a otro, hasta que salga una chispa.":[13,22.82,3.6],"Golpea las piedras justo cuando la marca pase por el centro. Hacen falta tres chispas.":[13,26.72,5.04],"¡Una chispa! ¿Qué le pones primero para que prenda?":[13,32.06,3.4],"Ya hay llama. Échale leña de la más fina a la más gorda.":[13,35.76,3.72],"La hoguera tiene que durar toda la noche. ¿Cuántos troncos hacen falta?":[13,39.78,4.08],"¡Hoguera encendida!":[13,44.16,1.28],"Pinta tu cueva":[13,45.74,1.04],"¡Enciende el fuego!":[13,47.08,1.009],"Las pinturas de Altamira las descubrió una niña de ocho años. Miró al techo y dijo: ¡mira, papá, bueyes!":[14,0.3,6.76],"Para dejar su mano en la pared, la apoyaban en la roca y soplaban la pintura alrededor.":[14,7.36,4.32],"Para pintar al fondo de la cueva se alumbraban con lámparas de piedra que quemaban grasa de animal.":[14,11.98,4.72],"Hace unos cuatrocientos mil años ya sabían encender fuego sacando chispas con dos piedras.":[14,17.0,4.88],"El bifaz servía para cortar, raspar y cavar: era la navaja de la Prehistoria.":[14,22.18,5.08],"Las agujas de la Prehistoria ya tenían su agujerito para el hilo, como las de hoy.":[14,27.56,3.96],"El perro fue el primer animal que vivió con las personas, mucho antes que las ovejas y las vacas.":[14,31.82,5.2],"Con huesos y colmillos de mamut se construían cabañas enteras.":[14,37.32,3.44],"Cuando aprendieron a sembrar trigo, dejaron de viajar: había que quedarse a cuidar el campo.":[14,41.06,4.76],"Las primeras vasijas se hacían enrollando churros de barro, uno encima de otro, y cociéndolas al fuego.":[14,46.12,5.6],"El dolmen de Menga, en Antequera, tiene una piedra que pesa como veinticinco elefantes.":[14,52.02,4.92],"Antes de la rueda, las cosas pesadas se arrastraban. La rueda se inventó hace unos cinco mil quinientos años.":[14,57.24,6.06],"Ötzi vivió hace más de cinco mil años y apareció congelado en los Alpes, con su hacha de cobre, su arco y ¡sesenta y un tatuajes!":[14,63.6,8.2],"En Atapuerca, en Burgos, se han encontrado restos de las personas más antiguas de Europa occidental: tienen más de un millón de años.":[14,72.1,7.88],"Los neandertales eran otra clase de personas: fuertes, hacían fuego y cuidaban de sus enfermos.":[14,80.28,5.742],"La carrera del estadio. Toca un pie y después el otro, lo más rápido que puedas.":[15,0.3,5.04],"El lanzamiento de disco. Primero, para la barra cuando la fuerza esté arriba del todo. Después, lanza a media altura: ni muy alto ni muy bajo.":[15,5.64,9.16],"El salto de longitud. Salta justo al llegar a la tabla, sin pasarte. Y en lo más alto del salto, echa las pesas hacia atrás.":[15,15.1,8.28],"El lanzamiento de jabalina. Fuerza arriba del todo y a media altura, como con el disco.":[15,23.68,5.54],"Hoy hay viento. Si sopla en contra, lanza más bajo. Si sopla a favor, lanza más alto.":[15,29.52,5.72],"La lucha. Gana quien derriba tres veces al otro. Empuja solo cuando tu rival se tambalee.":[15,35.54,5.94],"Mira bien por dónde pasa el hilo. Después, repite el camino casilla a casilla hasta el Minotauro.":[15,41.78,5.72],"Teseo ya ha vencido al Minotauro. Ahora hay que salir: repite el camino al revés, hasta la puerta.":[15,47.8,5.94],"¡El hilo se ha roto! Piensa por dónde pasaba en los trozos que faltan y vuelve hasta la puerta.":[15,54.04,5.32],"Construye el templo de abajo arriba. Toca una pieza y después su sitio.":[15,59.66,4.42],"Fíjate en el capitel, la pieza de arriba de la columna: liso es dórico, con caracolas es jónico y con hojas es corintio.":[15,64.38,8.46],"Ahora, sin ayuda. Y cuidado: hay piezas que no son de un templo griego.":[15,73.14,4.6],"Construye un templo dórico.":[15,78.04,1.72],"Construye un templo jónico.":[15,80.06,1.8],"Construye un templo corintio.":[15,82.16,1.74],"¡Así se caería! Primero va lo de abajo.":[15,84.2,2.44],"¡Terminado! Ahora lo pintamos: los templos griegos estaban llenos de color.":[15,86.94,4.78],"Fíjate bien en cada carta. Tócala y te cuento quién es. Cuando te lo sepas, pulsa el botón.":[15,92.02,5.44],"¿De quién es esto? Toca a su dueño.":[15,97.76,2.36],"¿A qué dios se lo pide?":[15,100.42,1.36],"¿Quién ha sido?":[15,102.08,0.88],"Dos son verdad y una es cuento. Toca el cuento.":[15,103.26,2.78],"Las Olimpiadas":[15,106.34,1.22],"El hilo de Ariadna":[15,107.86,1.3],"Monta el templo":[15,109.46,1.12],"Los dioses del Olimpo":[15,110.88,1.456],"En las Olimpiadas antiguas no había medallas. El premio era una corona de ramas de olivo.":[16,0.3,5.0],"La carrera de Olimpia medía un estadio: unos ciento noventa y dos metros. Por eso hoy llamamos estadios a los campos de deporte.":[16,5.6,7.72],"Los saltadores griegos saltaban con una pesa en cada mano, y al ritmo de una flauta.":[16,13.62,4.54],"La primera mujer que ganó en unas Olimpiadas fue Cinisca, una princesa de Esparta. Los caballos de su carro llegaron los primeros.":[16,18.46,7.5],"Según el mito, Teseo ató un hilo a la puerta del laberinto para poder salir. Se lo había dado la princesa Ariadna.":[16,26.26,6.88],"En la isla de Creta hubo un palacio con cientos de habitaciones. ¡Normal que la gente imaginara un laberinto!":[16,33.44,5.9],"Para saber de qué estilo es un templo griego, mira arriba de la columna: liso es dórico, con caracolas es jónico y con hojas es corintio.":[16,39.64,9.22],"Los templos y las estatuas de Grecia no eran blancos: estaban pintados de azul, rojo y otros colores. La pintura se ha borrado con los siglos.":[16,49.16,9.12],"La lechuza de Atenea salía en las monedas de Atenas. Y hoy sigue saliendo en la moneda de un euro de Grecia.":[16,58.58,5.78],"Según el mito, Hermes inventó la lira el mismo día que nació, con el caparazón de una tortuga.":[16,64.66,5.6],"El monte Olimpo existe de verdad: es la montaña más alta de Grecia. Los griegos creían que los dioses vivían en su cima.":[16,70.56,7.52],"En el teatro griego todos los actores eran hombres y llevaban máscaras. Así, uno solo podía hacer varios personajes.":[16,78.38,7.24],"En Atenas se podía votar para echar a alguien de la ciudad durante diez años. Escribían su nombre en un trozo de vasija rota.":[16,85.92,6.98],"Hace más de dos mil años, el sabio Eratóstenes midió el tamaño de la Tierra con la sombra de un palo. ¡Y se acercó mucho!":[16,93.2,7.04],"En un barco hundido apareció una máquina griega llena de ruedas dentadas. Servía para saber dónde iban a estar el Sol y la Luna.":[16,100.54,7.093],"Zeus es el rey de los dioses y manda en el cielo. Su arma es el rayo.":[17,0.3,4.28],"Poseidón es el dios del mar. Lleva un tridente, que es como un tenedor gigante de tres puntas.":[17,4.88,5.5],"Atenea es la diosa de la sabiduría. Su animal es la lechuza.":[17,10.68,3.68],"Hermes es el mensajero de los dioses. Vuela con sus sandalias con alas.":[17,14.66,4.24],"Artemisa es la diosa de la caza y de los bosques. Siempre lleva su arco.":[17,19.2,4.16],"Apolo es el dios de la música y de la luz. Toca la lira.":[17,23.66,3.38],"Hefesto es el herrero de los dioses. Trabaja en su fragua con el martillo.":[17,27.34,4.32],"Deméter es la diosa de las cosechas. Lleva espigas de trigo.":[17,31.96,3.66],"Afrodita es la diosa del amor y de la belleza. Su animal es la paloma.":[17,35.92,4.3],"Hera es la reina de los dioses y protege a las familias. Su animal es el pavo real.":[17,40.52,5.0],"Dioniso es el dios de las fiestas y del teatro. Lleva racimos de uvas.":[17,45.82,4.32],"Ares es el dios de la guerra. Va siempre con su lanza y su escudo.":[17,50.44,3.78],"Medusa tenía serpientes en vez de pelo. Quien la miraba se convertía en piedra.":[17,54.52,4.7],"El Minotauro tenía cuerpo de hombre y cabeza de toro. Vivía encerrado en un laberinto.":[17,59.52,4.78],"El cíclope Polifemo era un gigante con un solo ojo. Vivía en una cueva con sus ovejas.":[17,64.6,5.44],"Pegaso era un caballo con alas que volaba por el cielo.":[17,70.34,2.82],"Soy marinero y mañana salgo a navegar. ¡Que el mar esté tranquilo!":[17,73.46,3.66],"Soy campesina. ¡Que este año crezca mucho trigo!":[17,77.42,3.22],"Mañana tengo que resolver un problema muy difícil. ¡Ayúdame a pensar bien!":[17,80.94,4.36],"Tengo que llevar un mensaje muy lejos, y tiene que llegar hoy.":[17,85.6,3.42],"Soy herrero y tengo que hacer un escudo. ¡Que no se apague mi fragua!":[17,89.32,3.74],"Hoy estrenamos una obra de teatro. ¡Que le guste al público!":[17,93.36,3.6],"Soy soldado y mañana hay batalla. ¡Dame valor!":[17,97.26,2.98],"Estoy enamorado y no me atrevo a decírselo. ¡Ayúdame!":[17,100.54,3.4],"Las olas han volcado los barcos del puerto. Y además, la tierra ha temblado.":[17,104.24,4.72],"Han desaparecido las vacas de Apolo. Y lo más raro: las huellas van hacia atrás.":[17,109.26,5.08],"El trigo ha dejado de crecer y ha llegado el frío del invierno.":[17,114.64,3.14],"En lo alto de la ciudad ha aparecido un olivo que ayer no estaba.":[17,118.08,3.54],"En el jardín hay tres estatuas de piedra con cara de susto. ¡Ayer eran personas!":[17,121.92,4.86],"Alguien ha tapado la entrada de la cueva con una roca que no moverían ni veinte hombres.":[17,127.08,4.56],"Unos pastores han oído cascos de caballo… ¡entre las nubes!":[17,131.94,3.9],"En el centro del laberinto se oye bramar a alguien, como un toro furioso.":[17,136.14,4.276],"En las Olimpiadas de la antigua Grecia, el campeón ganaba una medalla de oro.":[18,0.3,4.22],"Su premio era una corona de ramas de olivo. Las medallas son un invento moderno.":[18,4.82,5.22],"El monte Olimpo, donde decían que vivían los dioses, es una montaña de verdad.":[18,10.34,4.66],"Es la montaña más alta de Grecia. Los griegos creían que los dioses vivían en su cima.":[18,15.3,5.84],"En el teatro griego, los actores llevaban máscaras.":[18,21.44,3.0],"Con las máscaras, un mismo actor podía hacer varios personajes. Y todos los actores eran hombres.":[18,24.74,6.36],"El Minotauro existió: los arqueólogos han encontrado sus huesos.":[18,31.4,4.14],"El Minotauro es un mito. Lo que sí existió es un palacio enorme en la isla de Creta, con cientos de habitaciones.":[18,35.84,6.98],"La palabra «alfabeto» viene de las dos primeras letras griegas: alfa y beta.":[18,43.12,5.04],"Alfa y beta son la a y la be de los griegos. Muchísimas palabras nuestras vienen del griego.":[18,48.46,6.34],"Las estatuas y los templos griegos eran blancos, como los vemos hoy.":[18,55.1,4.02],"Estaban pintados de azul, rojo y otros colores. La pintura se ha ido borrando con el paso de los siglos.":[18,59.42,6.9],"En las Olimpiadas antiguas ya se corría la maratón.":[18,66.62,2.9],"La maratón se inventó hace unos ciento treinta años. La historia del mensajero que corrió de Maratón a Atenas es una leyenda que se escribió siglos después.":[18,69.82,9.2],"En la democracia de Atenas, las mujeres no podían votar.":[18,79.32,3.28],"Ni las mujeres, ni los esclavos, ni los extranjeros podían votar. Aun así, fue una idea nueva: que las decisiones las tomaran muchos, y no un rey.":[18,82.9,10.04],"Los antiguos griegos creían que la Tierra era plana.":[18,93.24,3.06],"El sabio Eratóstenes midió la Tierra con la sombra de un palo, hace más de dos mil años. ¡Y se acercó mucho!":[18,96.6,6.62],"Los atletas de las Olimpiadas antiguas competían sin ropa.":[18,103.52,3.52],"Competían desnudos. Por eso «gimnasio» viene de una palabra griega que significa desnudo.":[18,107.34,6.42],"Durante las Olimpiadas había una tregua para que todos pudieran viajar seguros.":[19,0.3,4.16],"Los saltadores saltaban con una pesa en cada mano.":[19,4.76,2.64],"Los campeones se llevaban de Olimpia un cofre lleno de monedas.":[19,7.7,3.56],"En Olimpia el premio era solo una corona de olivo. Eso sí: al volver a casa, su ciudad les hacía regalos.":[19,11.56,6.72],"En la asamblea de Atenas se votaba levantando la mano.":[19,18.58,2.64],"Para echar a alguien de la ciudad, escribían su nombre en un trozo de vasija.":[19,21.52,3.96],"Las leyes de Atenas las decidía un solo rey.":[19,25.78,2.68],"En Atenas no decidía un rey: decidían los ciudadanos reunidos en asamblea. Eso significa democracia: el poder del pueblo.":[19,28.76,8.38],"Según el mito, Ulises engañó al cíclope diciéndole que se llamaba Nadie.":[19,37.44,4.1],"Según el mito, Hermes inventó la lira con el caparazón de una tortuga.":[19,41.84,4.2],"Según el mito, Atenea regaló a la ciudad de Atenas un tridente.":[19,46.34,3.74],"Atenea regaló un olivo, y la ciudad la eligió como protectora. El tridente es de Poseidón.":[19,50.38,6.14],"Los griegos construyeron una máquina con ruedas dentadas para seguir al Sol y a la Luna.":[19,56.82,4.62],"En el teatro de Epidauro caben más de doce mil personas.":[19,61.74,3.24],"Las actrices más famosas de Grecia actuaban en el teatro de Epidauro.":[19,65.28,3.82],"En el teatro griego no había actrices: todos los papeles, también los de mujer, los hacían hombres con máscara.":[19,69.4,6.244],"Gira los tramos del acueducto hasta que el agua llegue a la fuente. Piensa antes de tocar: cada giro cuenta.":[20,0.3,6.6],"Ahora el agua tiene que llegar a dos sitios: a la fuente y a las termas.":[20,7.2,4.28],"Hay tramos rotos. Toca una pieza nueva y después el hueco donde va. Luego gira hasta que llegue el agua.":[20,11.78,6.36],"Viste al legionario. Llévale solo lo que llevaba un soldado romano.":[20,18.44,4.16],"Escucha lo que necesita el legionario y dale la cosa que sirve para eso.":[20,22.9,3.8],"Un legionario, un senador y un gladiador. Lleva cada cosa a su dueño.":[20,27.0,5.18],"Forma la tortuga. Elige cómo se pone el escudo y toca a cada soldado. Que no quede ningún hueco.":[20,32.48,6.72],"¿Cuánto cuesta? Escríbelo con números romanos y pulsa pagar.":[20,39.5,3.94],"Ahora hay que restar: una letra pequeña delante de una grande se resta.":[20,43.74,4.48],"Suma los dos precios y escribe el total con números romanos.":[20,48.52,3.5],"¿Cuánto te devuelven? Escríbelo con números romanos.":[20,52.32,3.28],"¿Qué número es? Escríbelo con cifras.":[20,55.9,2.64],"Cambia de carril para esquivar los obstáculos. La carrera dura siete vueltas.":[20,58.84,4.511],"Coge las curvas por dentro, por el carril de arriba, y saldrás más deprisa.":[20,63.651,3.98],"Corres con los Rojos contra los Verdes, los Azules y los Blancos. ¡Intenta llegar antes que ellos!":[20,67.931,5.42],"¿Qué descubres?":[20,73.651,0.96],"Lleva el agua a la ciudad":[20,74.911,1.34],"Viste al legionario":[20,76.551,1.26],"El mercado":[20,78.111,0.84],"Carrera de cuadrigas":[20,79.251,1.28],"Necesito algo que me proteja la cabeza, el cuello y las mejillas.":[20,80.831,3.44],"Necesito algo de hierro que me proteja el pecho y los hombros, pero que me deje moverme.":[20,84.571,4.44],"Necesito algo muy grande, que me tape desde el hombro hasta la rodilla.":[20,89.311,3.7],"Necesito un arma corta, que pueda usar aunque vaya muy pegado a mis compañeros.":[20,93.311,4.4],"Necesito algo que pueda lanzar con la mano desde lejos.":[20,98.011,3.0],"Necesito algo para andar treinta kilómetros en un día sin resbalar.":[20,101.311,3.64],"El acueducto de Segovia está hecho con unos veinte mil bloques de granito, puestos unos encima de otros sin nada que los pegue. ¡Y lleva en pie casi dos mil años!":[21,0.3,9.36],"Los romanos hicieron tantos caminos que, puestos uno detrás de otro, darían más de siete vueltas a la Tierra.":[21,9.96,6.12],"En Córdoba, los romanos hicieron un puente para cruzar el río Guadalquivir. Durante casi dos mil años fue el único puente de la ciudad.":[21,16.38,7.64],"Las sandalias de los legionarios llevaban clavos en la suela para no resbalar, como los tacos de las botas de fútbol.":[21,24.32,6.16],"Para protegerse, los legionarios juntaban los escudos por delante, por los lados y por encima de la cabeza. Lo llamaban la tortuga.":[21,30.78,8.6],"En el Circo Máximo, las siete vueltas de cada carrera se contaban con siete delfines de bronce: al acabar cada vuelta, se bajaba uno.":[21,39.68,8.08],"El conductor de cuadrigas más famoso de Roma nació en Hispania. Se llamaba Diocles y ganó más de mil cuatrocientas carreras.":[21,48.06,7.76],"Con solo siete letras se escriben los números romanos. Pero ninguna sirve para el cero.":[21,56.12,5.12],"La salsa preferida de los romanos, el garum, se hacía con tripas de pescado y sal, dejadas al sol durante semanas. ¡Y el de Hispania era de los más famosos!":[21,61.54,9.66],"Dos meses llevan el nombre de dos romanos: julio, por Julio César, y agosto, por el emperador Augusto.":[21,71.5,6.92],"Los romanos se limpiaban con aceite de oliva: se untaban el cuerpo y luego se lo quitaban, con toda la suciedad, rascando con una herramienta curva.":[21,78.72,8.34],"Los romanos ya tenían calefacción: el suelo se apoyaba en pilares pequeños y, por debajo, pasaba el aire caliente de un horno.":[21,87.36,7.52],"¿Pulgar hacia abajo para el gladiador que pierde? Nadie sabe cómo era ese gesto de verdad. Lo del pulgar hacia abajo lo hizo famoso un cuadro pintado hace unos ciento cincuenta años.":[21,95.18,10.26],"El teatro romano de Mérida tiene más de dos mil años, y todavía se usa: cada verano se llena de gente para ver obras de teatro.":[21,105.74,7.54],"En Itálica, muy cerca de Sevilla, nació Trajano: el primer emperador de Roma nacido en Hispania.":[21,113.58,5.991],"Los romanos ricos comían tumbados en sofás.":[22,0.3,2.64],"En los banquetes se tumbaban de lado, apoyados en un codo. La gente corriente comía sentada.":[22,3.24,5.32],"Para decir que un gladiador había perdido, los romanos bajaban el pulgar.":[22,8.86,3.9],"Nadie sabe cómo era ese gesto. Lo del pulgar hacia abajo viene de un cuadro pintado hace unos ciento cincuenta años.":[22,13.06,6.84],"Algunas casas romanas tenían calefacción debajo del suelo.":[22,20.2,3.2],"El aire caliente de un horno pasaba por debajo del suelo y lo calentaba.":[22,23.7,3.7],"Los romanos se limpiaban el cuerpo con aceite de oliva.":[22,27.7,2.8],"Se untaban aceite y luego se lo quitaban, con la suciedad, rascando con una herramienta curva.":[22,30.8,5.32],"A los romanos les encantaba la pizza con tomate.":[22,36.42,2.78],"No conocían el tomate: llegó de América unos mil quinientos años después.":[22,39.5,4.34],"En los váteres públicos de Roma, la gente se sentaba en fila, sin puertas ni paredes.":[22,44.14,5.06],"Eran un banco largo de piedra con agujeros, uno al lado del otro.":[22,49.5,3.651],"En los banquetes había una sala para vomitar, llamada vomitorio.":[22,53.451,3.92],"Los vomitorios eran los pasillos por donde salía la gente del teatro y del anfiteatro.":[22,57.671,4.84],"Los niños romanos jugaban con muñecas, con aros y con nueces.":[22,62.811,3.72],"Se han encontrado sus muñecas. Con las nueces jugaban como hoy con las canicas.":[22,66.831,4.94],"Las estatuas romanas eran blancas, sin pintar.":[22,72.071,2.76],"Estaban pintadas de colores vivos. Con los siglos, la pintura se ha borrado.":[22,75.131,4.6],"En las lavanderías romanas se usaba pis para lavar la ropa.":[22,80.031,3.16],"El pis viejo quita muy bien las manchas de grasa. Después aclaraban la ropa con mucha agua.":[22,83.491,5.46],"Los romanos escribían en hojas de papel, como nosotros.":[22,89.251,3.2],"El papel se inventó en China y tardó mil años en llegar a Europa. Escribían en tablillas de cera y en papiro.":[22,92.751,6.98],"En las calles de Roma había bares donde se compraba comida caliente.":[22,100.031,3.54],"En Pompeya se han encontrado más de ochenta, con sus mostradores y sus tinajas.":[22,103.871,4.649],"Julio César va al Coliseo a ver a los gladiadores.":[23,0.3,2.8],"Julio César murió en el año 44 antes de Cristo, y el Coliseo se inauguró en el año 80 después de Cristo.":[23,3.4,6.42],"Una familia romana cena patatas fritas con tomate.":[23,10.12,2.86],"Las patatas, el tomate, el maíz y el chocolate llegaron de América unos mil quinientos años después.":[23,13.28,6.32],"Un legionario que vive en Britania recibe una carta con calcetines y calzoncillos de regalo.":[23,19.9,4.84],"En el fuerte de Vindolanda, en Inglaterra, aparecieron más de mil cartas y notas. Una habla de calcetines, sandalias y calzoncillos.":[23,25.04,8.3],"Un mercader de Cádiz vende en Roma su salsa de pescado.":[23,33.64,3.1],"La salsa de pescado y el aceite de Hispania viajaban hasta Roma en barco, dentro de ánforas.":[23,37.04,5.26],"Un viajero va de Cádiz a Roma andando, siempre por calzadas romanas.":[23,42.6,4.06],"Se conservan cuatro vasos de plata con la lista de todas las paradas de Cádiz a Roma: más de dos mil quinientos kilómetros.":[23,46.96,6.74],"Para subir las piedras de un acueducto, los obreros usan una grúa.":[23,54.0,3.74],"Las grúas romanas tenían una rueda grande de madera. Al andar dentro, como un hámster, la cuerda subía la piedra.":[23,58.04,6.7],"Un romano escribe el número cero en su tablilla.":[23,65.04,2.56],"Los números romanos no tienen cero. El cero que usamos llegó muchos siglos después, desde la India.":[23,67.9,5.72],"Una romana paga en el mercado con billetes.":[23,73.92,2.46],"Los romanos pagaban con monedas de bronce, de plata y de oro. Los billetes se inventaron en China muchos siglos después.":[23,76.68,6.96],"Un senador romano se pone las gafas para leer.":[23,83.94,2.52],"Las gafas se inventaron en Italia hace unos setecientos años. El romano que veía mal pedía a alguien que le leyera.":[23,86.76,6.507],"Septiembre viene de «septem», que en latín es siete. Pero es el mes nueve. ¿Por qué?":[24,0.3,5.56],"Contando desde marzo, septiembre es el séptimo mes, octubre el octavo, noviembre el noveno y diciembre el décimo.":[24,6.16,7.0],"Mérida se llamaba Emérita Augusta. Un emérito era un soldado que ya había terminado su servicio. ¿Para quién se fundó la ciudad?":[24,13.46,7.6],"Augusto premió a sus soldados veteranos con tierras y con una ciudad nueva: Mérida.":[24,21.36,4.84],"La ciudad de León se llamaba «Legio». ¿Qué había allí en tiempos de los romanos?":[24,26.5,4.44],"León nació como campamento de una legión romana. Su nombre viene de legión, no del animal.":[24,31.24,5.32],"Zaragoza se llamaba Cesaraugusta. ¿De quién lleva el nombre?":[24,36.86,3.6],"Di «Cesaraugusta» muy deprisa muchas veces: con los siglos, se fue convirtiendo en «Zaragoza».":[24,40.76,6.88],"Martes viene de Marte, miércoles de Mercurio, jueves de Júpiter y viernes de Venus. ¿Y lunes?":[24,47.94,6.46],"Los romanos pusieron a los días nombres de sus dioses y de los astros. El lunes es el día de la Luna.":[24,54.7,5.76],"Junto a una calzada hay una columna de piedra con un número romano grabado. ¿Para qué servía?":[24,60.76,5.0],"Se llama miliario. Una milla romana eran mil pasos dobles: casi un kilómetro y medio.":[24,66.06,5.78],"En A Coruña hay un faro que construyeron los romanos: la Torre de Hércules. Casi dos mil años después, ¿qué hace?":[24,72.14,6.68],"Es el faro en funcionamiento más antiguo del mundo.":[24,79.12,2.88],"En Las Médulas, en León, las montañas son rojas y tienen formas muy raras. Los romanos buscaban oro allí. ¿Qué les pasó a las montañas?":[24,82.3,8.66],"Llevaban el agua por canales larguísimos y la soltaban de golpe por túneles: la montaña se venía abajo. Fue la mayor mina de oro del Imperio.":[24,91.26,8.32],"En latín, agua se dice «aqua», tierra se dice «terra» y luna se dice «luna». ¿Por qué se parecen tanto al español?":[24,99.88,7.6],"El español, el gallego, el catalán, el portugués, el francés y el italiano vienen del latín. El euskera, en cambio, ya se hablaba antes de que llegaran los romanos.":[24,107.78,10.211],"¡Hola! Soy Mochi, tu mochila. ¿Cómo te llamas? Escribe tu nombre y elige tu personaje.":[25,0.3,6.02],"Puedes cambiar tu nombre o elegir otro personaje.":[25,6.62,2.489],"¡Hola! Soy Mochi, tu mochila. ¿Cómo te llamas? Escribe tu nombre y elige tu animal.":[26,0.3,5.66],"¿Quién va a jugar hoy?":[26,6.26,1.2],"Puedes cambiar tu nombre o elegir otro animal.":[26,7.76,2.62],"¿Qué quieres practicar? Elige y pulsa jugar.":[26,10.68,2.84],"Elige el nivel y pulsa jugar.":[26,13.82,1.9],"¡Nuevo nivel desbloqueado!":[26,16.02,1.6],"¡Muy bien!":[26,17.92,1.04],"¡Genial!":[26,19.26,0.96],"¡Bravo!":[26,20.52,0.92],"¡Lo has clavado!":[26,21.74,1.14],"¡Fenomenal!":[26,23.18,1.08],"¡Estupendo!":[26,24.56,1.04],"¡Perfecto!":[26,25.9,1.0],"¡Casi!":[26,27.2,0.7],"Uy, prueba otra vez.":[26,28.2,1.36],"¡Tú puedes!":[26,29.86,0.96],"Piénsalo un poquito más.":[26,31.12,1.6],"¡Buen trabajo!":[26,33.02,1.1],"¡Increíble!":[26,34.42,1.04],"♪sfx-ok":[26,35.76,0.27],"♪sfx-ko":[26,36.33,0.28],"♪sfx-win":[26,36.91,0.6],"♪sfx-tap":[26,37.81,0.04],"♪sfx-pop":[26,38.15,0.1],"♪sfx-star":[26,38.55,0.28],"♪fiesta":[26,39.13,8.0]}};

/* Los efectos cortos y las notas tienen cada uno su archivo pequeño (carpeta snd), que empieza con 0,15 s de silencio.

const FXFILES=['sfx-ok','sfx-ko','sfx-win','sfx-tap','sfx-pop','sfx-star','n-do','n-re','n-mi','n-sol','n-la'];

function fxPlay(k,onend,onstart){

let haUnlocked=false, stuckSince=0, ctxStale=false, webFails=0, watchT=0;
/* ¿ha arrancado el audio después de un toque? (solo en el iPad, abierta desde la pantalla de inicio y en «Automático») */
function webWatch(){
  if(!(STANDALONE&&IOS)||audioMode()!=='auto'||autoEng!=='web') return;
  clearTimeout(watchT); const c0=actx,t0=c0?c0.currentTime:0;
  watchT=setTimeout(()=>{
    if(document.hidden||autoEng!=='web'||audioMode()!=='auto') return;
    if(actx&&actx===c0&&actx.state==='running'&&actx.currentTime>t0){webFails=0;return;}
    webFails++; dlog(`audio web sin arrancar (${actx?actx.state:'sin crear'}), intento ${webFails}`);
    if(webFails<2){ctxStale=true;return;}   // al próximo toque, un contexto nuevo
    autoEng='html'; webFails=0; haSleep(); dlog('paso al motor html');
    try{DB.opt=DB.opt||{};DB.opt.autoHtml=Date.now();save();}catch(e){}
  },900);

/* El iPad solo deja sonar un reproductor si alguna vez arrancó dentro de un toque, y qué momento del toque vale
   (pointerup, touchend, click) depende de la versión de iPadOS. Por eso se intenta en todos ellos, toque tras toque,
   hasta que cada reproductor confirma que ha arrancado (suena un instante, en el silencio con el que empiezan los
   archivos). Antes se intentaba una sola vez: si ese momento no valía, los sonidos que no nacen directamente de un
   toque (notas de una melodía, estrellas, música del trofeo, instrumentos) se quedaban mudos. */
function haWake(){
  if(!V.files.length) return;
  const chans=[['voice',V.files[0]],['fx',V.files[0]],...FXCH.map(c=>[c,'snd/sfx-tap.mp4'])];
  const check=()=>{haUnlocked=chans.every(([c])=>HA[c]&&HA[c]._ok);};
  chans.forEach(([ch,file])=>{
    const a=haEl(ch); if(a._ok||a._done) return;   // ya despierto, o sonando de verdad ahora mismo
    const tok=a._wk=(a._wk||0)+1; let p;
    try{a.src=file+'#t=0,0.08';p=a.play();}catch(e){return;}
    const okay=()=>{a._ok=true;check();setTimeout(()=>{if(a._wk===tok&&!a._done){try{a.pause();}catch(e){}}},90);};
    if(p&&p.then) p.then(okay,e=>{if(e&&e.name!=='AbortError'&&e.name!=='NotAllowedError') dlog('despertar '+ch+': '+(e.message||e));}); else okay();
  });
}
function unlockAudio(){

    haWake();
    return;
  }

  /* contexto nuevo: al volver del segundo plano en la app de la pantalla de inicio (el viejo puede quedarse mudo aunque diga que suena) o si se quedó atascado */
  if(ctxStale){ctxStale=false; stuckSince=0; if(actx){const old=actx; actx=null; vsrc=null; SND.clear(); try{const p=old.close();if(p&&p.catch)p.catch(()=>{});}catch(e){}}}
  const c=ac(); if(!c){webWatch();return;}
  try{const b=c.createBuffer(1,1,22050),src=c.createBufferSource();src.buffer=b;src.connect(c.destination);src.start(0);}catch(e){}
  webWatch();
}
['touchend','pointerup','click','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(engine()==='html'?!haUnlocked:(!actx||actx.state!=='running'||ctxStale)) unlockAudio(); else stuckSince=0;},{capture:true,passive:true}));

});
/* como mucho 4 archivos de voz descodificados además de la voz general y los efectos (cada uno, de unos 4 minutos, ocupa unos 20 MB) */
function vtouch(i){
  V.used=(V.used||[]).filter(x=>x!==i); V.used.push(i);
  const pin=(APP.voicePin||[]).map(f=>V.files.indexOf(f)), loose=V.used.filter(x=>!pin.includes(x));
  while(loose.length>4){const j=loose.shift(); V.used=V.used.filter(x=>x!==j); delete V.buf[j]; delete V.load[j];}
}
/* Las voces están grabadas a 22.050 Hz. Se descodifican a esa misma frecuencia (con un contexto aparte) en vez de a la
   del altavoz (48.000 Hz en el iPad): ocupan menos de la mitad de memoria y suenan igual. Si el navegador no sabe, se
   descodifican con el contexto normal, como antes. */
let dctx;
function decodeVoice(ab){
  const viaMain=buf=>new Promise((res,rej)=>{const c=ac(); if(!c) return rej(new Error('sin audio')); c.decodeAudioData(buf,res,rej);});
  if(dctx===undefined){try{const O=window.OfflineAudioContext||window.webkitOfflineAudioContext; dctx=O?new O(1,1,22050):null;}catch(e){dctx=null;}}
  if(!dctx) return viaMain(ab);

  return new Promise((res,rej)=>{try{const p=dctx.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej);}catch(e){rej(e);}})
    .catch(e=>{dlog('descodificar a 22 kHz: '+(e&&e.message||e)); dctx=null; return viaMain(copy);});
}
function vbuf(i){
  if(V.buf[i]){vtouch(i); return Promise.resolve(V.buf[i]);}
  if(!V.load[i]){if(!ac()) return Promise.reject(new Error('sin audio'));
    V.load[i]=fetch(V.files[i]).then(r=>{if(!r.ok)throw new Error('voz');return r.arrayBuffer();})
      .then(decodeVoice).then(b=>{V.buf[i]=b;vtouch(i);return b;}).catch(e=>{delete V.load[i];dlog('voz '+i+': '+(e&&e.message||e));throw e;});}
  return V.load[i];

let preloaded=false;
/* solo se precargan la voz general y los efectos: descodificar todas ocupa cientos de MB en el iPad */
function preloadVoices(){if(preloaded||engine()!=='web')return;preloaded=true;(APP.voicePin||[]).forEach((f,k)=>{const i=V.files.indexOf(f);if(i>=0)setTimeout(()=>vbuf(i).catch(()=>{}),400*k);});}
/* sonidos de un clip (efectos, notas, instrumentos, música): no cortan la voz de Mochi.
   onstart avisa cuando el sonido empieza a oírse de verdad (en el modo «html» puede tardar un poco): sirve para
   que lo que se ve vaya a la vez que lo que se oye (las teclas de «Repite la melodía»). */
const SND=new Set();
function playSnd(key,{gain=1,onend,onstart}={}){
  const hit=V.map[key]; if(!hit){onend&&onend();return false;}
  if(engine()==='html'){const k=key.slice(1);if(FXFILES.includes(k)){fxPlay(k,onend,onstart);return true;}haPlay('fx',V.files[hit[0]],hit[1],hit[2],onend,onstart);return true;}
  if(!ac()){onend&&onend();return false;}
  vbuf(hit[0]).then(b=>{const c=ac(),s=c.createBufferSource(),g=c.createGain();g.gain.value=gain;s.buffer=b;s.connect(g).connect(c.destination);

}

function tone(freqs,dur=.12,type='sine',gain=.08){

    freqs.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;

}
const fx=k=>{if(DB.sound) playSnd('♪sfx-'+k);};

const canTTS=('speechSynthesis' in window);
function bestVoice(lang){

    const ex=vs.filter(v=>v.lang.replace('_','-')===lang),pool=ex.length?ex:vs;
    const sc=v=>(/premium|mejorad|enhanced|neural|natural|siri/i.test(v.name)?10:0)+(v.localService?1:0);

/* ---------- confeti y estrellitas ---------- */
let confettiN=0;
function confetti(){
  if(reduced) return;
  const mine=++confettiN;
  const c=$('#confetti'); c.hidden=false; const g=c.getContext('2d'); const W=c.width=innerWidth,H=c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);
  const cols=['--rojo','--azul','--verde','--morado','--rosa','--naranja','--star','--sun'].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:170},()=>({x:W/2+(Math.random()-.5)*W*.6,y:H*.42,vx:(Math.random()-.5)*16,vy:-Math.random()*16-5,r:Math.random()*7+5,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,s:Math.random()<.3}));
  const t0=performance.now(); let last=t0;
  function f(t){if(mine!==confettiN) return; const dt=Math.min(32,t-last)/16; last=t; g.clearRect(0,0,W,H);
    ps.forEach(p=>{p.vy+=.35*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;
      if(p.s){g.beginPath();g.arc(0,0,p.r*.6,0,6.3);g.fill();}else g.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);g.restore();});
    if(t-t0<2600) requestAnimationFrame(f); else {g.clearRect(0,0,W,H); c.hidden=true;}}
  requestAnimationFrame(f);
}
function burst(el){
  if(reduced||!el) return;
  for(let i=0;i<9;i++){const a=i/9*Math.PI*2;const s=h('span',{class:'burst','aria-hidden':'true',style:`--dx:${Math.round(Math.cos(a)*80)}px;--dy:${Math.round(Math.sin(a)*64)}px`},'★');el.append(s);setTimeout(()=>s.remove(),760);}
}
