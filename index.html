<script>
"use strict";
/* ================= PIEZAS COMUNES DE MOCHI HISTORIA =================
   Lo que comparten los juegos de todas las edades: las «cosas» con dibujo, las preguntas con altavoz, elegir dos
   cosas, ordenar tarjetas en el tiempo, la regla del tiempo, las escenas donde algo se ha colado y las capas de
   una excavación. Cada edad (b-prehistoria.html…) solo pone su contenido. */
const lvD=run=>run.lvl||1;
function seqBtn(lines){const b=h('button',{class:'say','aria-label':'Escuchar',onclick:()=>{b.classList.add('on');speakSeq(lines,undefined,()=>b.classList.remove('on'));}},ICO.sound());return b;}
/* enunciado con su altavoz (si son varias frases, las dice seguidas) */
const qline=(t,say=t)=>h('div',{class:'with-say'},h('div',{class:'q-prompt'},t),Array.isArray(say)?seqBtn(say.filter(Boolean)):sayBtn(say));

/* ---------- los dibujos de plastilina ----------
   Están en img/o-<nombre>.webp y la lista la escribe build/tools/dibujos.py (a0-dibujos.html: DIB y DIB_ALIAS).
   Un dibujo va SIEMPRE dentro de un span «hx-pic emo dib»: así ocupa lo mismo que el emoji al que sustituye
   (1,3 veces el tamaño de letra de ese sitio) y vale en cualquier juego sin tocar su CSS; lo que no tiene dibujo sigue con su emoji. */
const dibSrc=k=>{const n=DIB_ALIAS[k]||k;return DIB.has(n)?`img/o-${n}.webp`:null;};
const dibImg=s=>h('img',{class:'dib-i',src:s,alt:'',draggable:'false',decoding:'async'});
function dibu(k,e='',cls=''){const s=dibSrc(k);
  return s?h('span',{class:'hx-pic emo dib '+cls,'aria-hidden':'true'},dibImg(s)):h('span',{class:'hx-pic emo '+cls,'aria-hidden':'true'},e);}
/* un muñeco o un adorno de un juego (corredor, carro, antorcha…): el span lleva la clase del juego y, si hay dibujo, también «dib» */
function sprite(cls,k,e,attrs){const s=dibSrc(k);
  return h('span',Object.assign({class:cls+(s?' dib':''),'aria-hidden':'true'},attrs||{}),s?dibImg(s):e);}
/* lo de dentro de un sitio que ya existe: el dibujo o, si no lo hay, el emoji */
const dibI=(k,e='')=>{const s=dibSrc(k);return s?dibImg(s):e;};

/* ---------- las cosas: herramientas, animales, inventos… ----------
   Cada cosa tiene nombre (n) y un emoji de reserva (e) por si faltara su dibujo de plastilina. */
const COSA={};
const cosas=o=>Object.assign(COSA,o);
const cosaPic=(k,cls='')=>dibu(k,COSA[k].e,cls);
const cosaTile=k=>[cosaPic(k),h('span',{class:'opt-name'},COSA[k].n)];
const opcT=(a,w)=>shuffle([a,...w]).map(t=>({value:t,label:t}));
/* opciones con dibujo y nombre (una sola es la buena) */
const opcCosas=(keys,correct,ctx,o={})=>choices(keys.map(k=>({value:k,label:h('span',{class:'opt-in'},cosaTile(k))})),correct,ctx,Object.assign({cls:'cosas'+(keys.length===4?' four':'')},o));
/* Mochi cuenta algo en un bocadillo */
const mochiDice=(text,k='think')=>h('div',{class:'hx-escena'},h('img',{class:'hx-mochi',src:pic(k),alt:''}),h('div',{class:'hx-bocadillo'},text));
/* pregunta de texto con tres respuestas escritas */
function preguntaT(stage,ctx,p,{antes=[],hint='Piénsalo otra vez.',hablar=true}={}){
  stage.append(...antes,qline(p.q),choices(opcT(p.a,p.w),p.a,ctx,{wide:true,explain:p.why,voice:{post:p.why},hint}));
  if(hablar) instr(p.q);
}

/* ---------- elegir las dos cosas que hacen falta ---------- */
function elegirDos(keys,good,ctx,{explain,voice,hint}){
  const sel=new Set(),box=h('div',{class:'opts cosas four dos'});
  keys.forEach(k=>{const b=h('button',{class:'opt','data-k':k,'aria-pressed':'false',onclick:()=>{
      if(box.classList.contains('hecho')||b.classList.contains('ko')) return;
      if(sel.has(k)){sel.delete(k);b.classList.remove('sel');b.setAttribute('aria-pressed','false');sfx.tap();return;}
      sel.add(k);b.classList.add('sel');b.setAttribute('aria-pressed','true');sfx.tap();
      if(sel.size<2) return;
      const bad=[...sel].filter(x=>!good.includes(x));
      if(!bad.length){box.classList.add('hecho');
        box.querySelectorAll('.opt').forEach(x=>{x.classList.add('lock');if(sel.has(x.dataset.k)){x.classList.remove('sel');x.classList.add('ok');}});
        burst(b);ctx.right(explain,voice);}
      else{bad.forEach(x=>{sel.delete(x);const e=box.querySelector(`[data-k="${x}"]`);e.classList.remove('sel');e.setAttribute('aria-pressed','false');e.classList.add('ko');});ctx.wrong(hint);}
    }},cosaTile(k));box.append(b);});
  return box;
}

/* ---------- ordenar momentos, del más antiguo al más moderno ----------
   MOM[k]={t:título, k:cosa del dibujo, hace:años (cuanto mayor, más antiguo), cuando:frase con la fecha} */
function ordenarT(MOM,keys,ctx,{pistas,hint}){
  const steps=keys.slice().sort((a,b)=>MOM[b].hace-MOM[a].hace);let k=0;
  const list=h('ol',{class:'pasos-hechos linea-hecha'});
  const orden=shuffle(keys);
  const pool=h('div',{class:'pasos linea'},orden.map(key=>{const m=MOM[key];
    const b=h('button',{class:'paso tarjeta','data-k':key,onclick:()=>{
      if(b.disabled||k>=steps.length) return;
      if(key===steps[k]){b.disabled=true;b.classList.add('used');list.append(h('li',null,h('span',{class:'paso-e'},cosaPic(m.k)),h('span',null,m.t)));k++;sfx.pop();
        if(k===steps.length){burst(list);ctx.right(steps.map(s=>MOM[s].cuando).join(' '),{post:steps.map(s=>MOM[s].cuando)});}}
      else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');ctx.wrong(hint);}
    }},h('span',{class:'paso-e'},cosaPic(m.k)),h('span',{class:'tarjeta-t'},h('b',null,m.t),pistas?h('small',null,pistas[key]):null));return b;}));
  return [list,pool,orden];
}
/* la regla del tiempo: se toca una tarjeta y después su sitio; con todas colocadas sale la pregunta de pensar
   SLOTS=[{id,l}] de más antiguo a más moderno · sitio[k]=id del hueco de cada momento */
function reglaT(MOM,SLOTS,sitio,r,stage,ctx,S){
  let sel=null,done=0;
  const slots=SLOTS.map(s=>{const b=h('button',{class:'rtiempo-slot','aria-label':s.l,onclick:()=>{
      if(done===r.m.length) return;
      if(!sel){sfx.tap();showToast('Primero, una tarjeta','Toca una tarjeta y después su sitio en la regla.');return;}
      if(sitio[sel.dataset.k]===s.id){const c=sel;c.classList.remove('sel');c.disabled=true;c.classList.add('puesta');b.querySelector('.rtiempo-cosas').append(cosaPic(MOM[c.dataset.k].k));
        sfx.pop();burst(b);sel=null;done++;
        if(done===r.m.length){if(DB.sound)speakSeq([S.ok,r.q]);preg.hidden=false;preg.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});}}
      else{b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope');ctx.wrong(S.no);}
    }},h('span',{class:'rtiempo-cosas'}),h('span',{class:'rtiempo-l'},s.l));return b;});
  const cards=shuffle(r.m).map(k=>{const c=h('button',{class:'paso tarjeta mini','data-k':k,onclick:()=>{if(c.disabled)return;sfx.tap();
      if(sel) sel.classList.remove('sel'); sel=sel===c?null:c; if(sel) sel.classList.add('sel');}},h('span',{class:'paso-e'},cosaPic(MOM[k].k)),h('span',null,MOM[k].t));return c;});
  const preg=h('div',{class:'rtiempo-preg',hidden:true},qline(r.q),
    choices(opcT(r.a,r.w),r.a,ctx,{wide:true,explain:r.why,voice:{post:r.why},hint:'Mira la regla otra vez.'}));
  stage.append(qline('Coloca cada tarjeta en la regla del tiempo',S.pon),
    h('div',{class:'rtiempo'},h('div',{class:'rtiempo-flecha'},h('span',null,'⬅️ Más antiguo'),h('span',null,'Más moderno ➡️')),h('div',{class:'rtiempo-slots',style:`--n:${SLOTS.length}`},slots)),
    h('div',{class:'pasos linea'},cards),preg);
  instr(S.pon);
}

/* ---------- una escena con cosas: se toca lo que no es de esa época ---------- */
function escenaT(titulo,keys,onTap){
  return h('div',{class:'hx-lugar'},h('div',{class:'hx-lugar-t'},titulo),
    h('div',{class:'hx-lugar-cosas'},keys.map(k=>h('button',{class:'hx-cosa','data-k':k,'aria-label':COSA[k].n,onclick:e=>onTap(k,e.currentTarget)},cosaTile(k)))));
}
const nope=el=>{el.classList.remove('nope');void el.offsetWidth;el.classList.add('nope');};

/* ---------- las capas de una excavación (la de abajo es la más antigua) ----------
   capas: de arriba abajo, cada una {t:rótulo, k:[cosas]} */
function capasT(capas){
  /* cada cosa: su clave, o [clave, rótulo] si el rótulo no es el nombre de siempre («Huesos de reno») */
  const cs=capas.map(c=>c.map(x=>Array.isArray(x)?x:[x,COSA[x].n]));
  return h('div',{class:'hx-capas',role:'img','aria-label':'Capas de tierra de una excavación, de arriba abajo: '+cs.map((c,i)=>`capa ${i+1}, ${c.length?c.map(x=>x[1]).join(' y '):'vacía'}`).join('; ')},
    h('div',{class:'hx-capas-suelo'},'🌱 El suelo de hoy'),
    cs.map((c,i)=>h('div',{class:'hx-capa c'+(i+1)},h('span',{class:'hx-capa-n'},i===cs.length-1?'Abajo':i===0?'Arriba':'En medio'),
      h('span',{class:'hx-capa-cosas'},c.length?c.map(([k,n])=>h('span',{class:'hx-capa-cosa'},cosaPic(k),h('small',null,n))):h('small',{class:'hx-capa-nada'},'Aquí no hay nada')))));
}

/* ---------- las épocas como respuestas (con sus rasgos, o solo el nombre) ---------- */
function opcEpocas(EP,ids,correct,ctx,full,o={}){
  return choices(ids.map(e=>({value:e,label:h('span',{class:'opt-in'},sprite('era-ic',EP[e].k,EP[e].ic),h('span',{class:'era-n'},EP[e].n),full?h('span',{class:'era-r'},EP[e].rasgo):null)})),
    correct,ctx,Object.assign({cls:'eras'+(full?'':' solo')},o));
}

/* ---------- el museo: al acabar cada partida, una pieza con su curiosidad ----------
   PIEZA[k]={n:nombre, e:emoji provisional (o img), sec:sección, dato:curiosidad para niños (la dice Mochi),
   mayores:dato para los padres (solo escrito)}. Se guardan en p.album (el código de copia de seguridad ya lo lleva). */
const PIEZA={};
const piezas=(sec,o)=>{for(const k in o) PIEZA[k]=Object.assign({sec},o[k]);};
const tengo=(k,p=me())=>!!(p&&p.album&&p.album.includes(k));
function ganarPieza(k){const p=me(); if(!p||!PIEZA[k]||tengo(k,p)) return false; p.album=[...(p.album||[]),k]; save(); return true;}
const piezaPic=(k,cls='')=>dibu(k,PIEZA[k].e,cls);
/* la pieza que toca: la primera de la lista que el jugador aún no tiene (si las tiene todas, una al azar) */
const piezaDe=lista=>lista.find(k=>!tengo(k))||pick(lista);
function piezaCard(k,nuevo){const z=PIEZA[k];
  return h('div',{class:'pieza-card'+(nuevo?' nueva':'')},
    h('div',{class:'pieza-top'},h('span',{class:'pieza-pic'},piezaPic(k)),h('div',{class:'pieza-tx'},
      h('span',{class:'pieza-tag'},nuevo?'🏛️ ¡Pieza nueva para tu museo!':'🏛️ De tu museo'),h('h3',null,z.n),
      h('div',{class:'pieza-dato'},h('p',null,h('b',null,'¿Sabías que…? '),z.dato),sayBtn(z.dato)))),
    z.mayores?h('details',{class:'pieza-may'},h('summary',null,'Para los mayores'),h('p',null,z.mayores)):null);}
/* para el final de un juego:  recap(lvl){return sabias(['pieza1','pieza2'])}  (el motor lo enseña y Mochi lo lee) */
function sabias(lista){const k=piezaDe([].concat(lista)),nuevo=ganarPieza(k);
  return {el:piezaCard(k,nuevo),play(){speak(PIEZA[k].dato);}};}

/* ---------- ayudas para los juegos a medida (custom) ---------- */
/* bucle de animación: fn(dt en segundos, t). Se para solo al salir de la pantalla; devuelve una función para pararlo antes */
function bucle(fn){let on=true,last=performance.now();
  const f=t=>{if(!on)return;const dt=Math.min(50,t-last)/1000;last=t;try{fn(dt,t);}catch(e){on=false;dlog('bucle: '+e.message);return;}requestAnimationFrame(f);};
  requestAnimationFrame(f);const prev=cleanup;cleanup=()=>{on=false;prev&&prev();};return ()=>{on=false;};}
/* al salir de la pantalla del juego, haz esto (quitar escuchas, parar relojes…) */
function alSalir(fn){const prev=cleanup;cleanup=()=>{try{fn();}catch(e){} prev&&prev();};}
/* arrastrar con el dedo o con el ratón: coger(x,y), mover(x,y), soltar(x,y) en coordenadas de la ventana */
function arrastrable(el,o){let id=null;el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{if(id!==null)return;id=e.pointerId;try{el.setPointerCapture(id);}catch(x){} o.coger&&o.coger(e.clientX,e.clientY,e);e.preventDefault();});
  el.addEventListener('pointermove',e=>{if(e.pointerId===id&&o.mover)o.mover(e.clientX,e.clientY,e);});
  const fin=e=>{if(e.pointerId!==id)return;id=null;o.soltar&&o.soltar(e.clientX,e.clientY,e);};
  el.addEventListener('pointerup',fin);el.addEventListener('pointercancel',fin);}
</script>
<script>
"use strict";
/* ================= LA PREHISTORIA =================
   Cinco actividades; cada nivel pide un paso más de razonamiento y trae contenido nuevo:
   · ¿Para qué servía?: la herramienta que hace falta (1), las dos cosas que se necesitan (2), qué cambió y errores de museo (3).
   · La línea del tiempo: ordenar con pistas encadenadas (1), sin pistas (2) y en una regla de años, con preguntas de pensar (3).
   · ¿Quién se ha colado?: algo muy posterior (1), algo de otra época de la Prehistoria (2), dos cosas y el porqué (3).
   · ¿En qué época estamos?: una pista (1), dos pistas donde manda lo más moderno (2) y «¿pudo pasar?» (3).
   · Detectives de la cueva: qué dice un hallazgo (1), tres pistas para saber quién vivió allí (2) y las capas de la tierra (3).
   Fechas aproximadas, como se cuentan hoy; contrastadas con fuentes el 23 de noviembre de 2026. Todo lo que se dice está en PRE_VOICE() y se graba con la voz de Mochi. */
const PS={
  nec:'¿Qué necesita Mochi?',
  dos:'Para conseguirlo hacen falta dos cosas. Tócalas.',
  linea1:'Ordena los momentos: toca primero el más antiguo. Escucha las pistas: cada una te dice algo de otro momento.',
  linea2:'Ordena los momentos, del más antiguo al más moderno. Esta vez no hay pistas.',
  linea3:'Coloca cada tarjeta en su sitio de la regla del tiempo: toca una tarjeta y después su sitio.',
  reglaOk:'¡Bien colocado! Ahora piensa.',
  colado:'Aquí hay una cosa que no es de esta época. Tócala.',
  colado3:'Aquí hay dos cosas que no son de esta época. Encuéntralas.',
  unoMas:'¡Bien! Todavía queda otra cosa que no es de esta época.',
  epoca:'¿En qué época estamos?',
  pudo:'¿Pudo pasar?',
  det1:'¿Qué nos dice esta pista?',
  det2:'Junta las tres pistas. ¿Quién vivió aquí?',
  det3:'Mira las capas de tierra. La de abajo es la más antigua.',
};
/* ---------- las cosas de la Prehistoria (emoji provisional hasta tener los dibujos) ---------- */
cosas({
  // Paleolítico
  bifaz:{n:'Bifaz de piedra',e:'🪨'}, arco:{n:'Arco y flechas',e:'🏹'}, aguja:{n:'Aguja de hueso',e:'🪡'}, arpon:{n:'Arpón',e:'🎣'},
  lampara:{n:'Lámpara de grasa',e:'🪔'}, fuego:{n:'Hoguera',e:'🔥'}, ocre:{n:'Pintura de ocre',e:'🎨'}, raspador:{n:'Raspador de piedra',e:'🔪'},
  collar:{n:'Collar de conchas',e:'📿'}, cabana:{n:'Cabaña de pieles',e:'⛺'}, mamut:{n:'Mamut',e:'🦣'}, bisonte:{n:'Bisonte',e:'🦬'},
  perro:{n:'Perro',e:'🐕'}, mano:{n:'Manos pintadas',e:'🖐️'}, hueso:{n:'Huesos',e:'🦴'},
  // Neolítico
  trigo:{n:'Trigo',e:'🌾'}, hoz:{n:'Hoz',e:'🪝'}, molino:{n:'Piedra de moler',e:'🫓'}, vasija:{n:'Vasija de barro',e:'🏺'}, telar:{n:'Telar',e:'🧶'},
  hacha:{n:'Hacha de piedra pulida',e:'🪓'}, azada:{n:'Azada',e:'⛏️'}, oveja:{n:'Oveja',e:'🐑'}, cabra:{n:'Cabra',e:'🐐'}, semillas:{n:'Semillas',e:'🌱'},
  barro:{n:'Barro',e:'🟤'}, choza:{n:'Cabaña de barro y paja',e:'🛖'}, corral:{n:'Corral',e:'🚧'},
  // Edad de los Metales
  espada:{n:'Espada de bronce',e:'⚔️'}, carro:{n:'Carro con ruedas',e:'🛞'}, bueyes:{n:'Bueyes',e:'🐂'}, horno:{n:'Horno muy caliente',e:'♨️'},
  cobre:{n:'Cobre y estaño',e:'🟠'}, molde:{n:'Molde de piedra',e:'🧱'}, vela:{n:'Barco de vela',e:'⛵'}, muralla:{n:'Muralla',e:'🧱'},

defGame({id:'linea',subject:'prehistoria',recap(){return sabias(['pz-fuego','pz-trigo','pz-dolmen']);},icon:'🕰️',title:'La línea del tiempo',desc:'Ordena los grandes momentos de la Prehistoria. Nivel 2: sin pistas · Nivel 3: la regla de miles y millones de años, y preguntas para pensar',rounds:6,
  prepare(run){const l=lvD(run);
    if(l===1){run.data.next=deck(ORD1P);return;}
    if(l===2){const vistos=new Set(),sets=[];
      for(let i=0;sets.length<6&&i<400;i++){const ks=pickN(ORD2P,sets.length<2?4:5),id=ks.slice().sort().join();
        if(vistos.has(id)||(ks.includes('rueda')&&ks.includes('escritura'))) continue; vistos.add(id);sets.push(ks);}   // la rueda y la escritura son casi de la misma época: nunca juntas
      run.data.sets=sets;return;}
    run.data.next=deck(REGLAP);},
  make(run){const l=lvD(run);
    if(l===1) return {mode:'pistas',p:run.data.next()};
    if(l===2) return {mode:'solo',keys:run.data.sets[run.i%run.data.sets.length]};
    return {mode:'regla',r:run.data.next()};},
  render(q,stage,ctx){
    if(q.mode==='regla') return reglaT(MOMP,SLOTSP,SITIOP,q.r,stage,ctx,{pon:PS.linea3,ok:PS.reglaOk,no:'Ahí no va. Mira los años.'});
    const pistas=q.mode==='pistas'?q.p:null,keys=pistas?Object.keys(pistas):q.keys;
    const [list,pool,orden]=ordenarT(MOMP,keys,ctx,{pistas,hint:'Piensa qué pasó antes.'});
    const ask=pistas?PS.linea1:PS.linea2;
    stage.append(h('div',{class:'with-say'},h('div',{class:'q-prompt'},'Del más antiguo al más moderno'),seqBtn([ask,...orden.flatMap(k=>pistas?[MOMP[k].t,pistas[k]]:[MOMP[k].t])])),list,pool);
    instr(ask);
  }});

/* ================= PINTA TU CUEVA ================= */
const PINTA=[null,{an:'🦬',k:'bisonte',n:'el bisonte'},{an:'🐎',k:'caballo',n:'el caballo'},{an:'🦌',k:'ciervo',n:'el ciervo'}];
const TINTES={rojo:{n:'Ocre rojo',c:'#A63A1F'},carbon:{n:'Carbón',c:'#2A211C'},mano:{n:'Mano soplada',c:'#A63A1F'}};
/* la silueta del animal como rejilla de casillas. Sale del dibujo de plastilina (de su transparencia); mientras llega,
   y por si faltara, se usa la del emoji dibujado en pequeño, y si el dispositivo tampoco lo dibuja, una mancha ovalada */
function mascara(d,gw,gh,src){
  const m=new Uint8Array(gw*gh);let n=0;
  if(d) for(let i=0;i<gw*gh;i++) if(d[i*4+3]>90){m[i]=1;n++;}
  if(n<gw*gh*.06){n=0;for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const dx=(x-gw/2)/(gw*.3),dy=(y-gh/2)/(gh*.3);if(dx*dx+dy*dy<1){m[y*gw+x]=1;n++;}}}
  /* borde: casillas de la silueta que tocan el exterior */
  const b=new Uint8Array(gw*gh);let nb=0;
  for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const i=y*gw+x;if(!m[i])continue;
    if(x===0||y===0||x===gw-1||y===gh-1||!m[i-1]||!m[i+1]||!m[i-gw]||!m[i+gw]){b[i]=1;nb++;}}
  return {m,b,n,nb,src};
}
function siluetaDe(emo,gw,gh){
  const c=document.createElement('canvas');c.width=gw;c.height=gh;const g=c.getContext('2d');let d=null;
  try{g.font=`${Math.round(gh*.78)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;g.textAlign='center';g.textBaseline='middle';g.fillText(emo,gw/2,gh*.54);d=g.getImageData(0,0,gw,gh).data;}catch(e){}
  return mascara(d,gw,gh,c);
}
/* la del dibujo: se recorta a lo que ocupa el animal y se centra; «listo» recibe la silueta y el dibujo en grande para la guía */
function siluetaDib(k,gw,gh,W,H,listo){
  const s=dibSrc(k); if(!s) return;
  const im=new Image();
  im.onload=()=>{try{
    const t=document.createElement('canvas');t.width=im.naturalWidth;t.height=im.naturalHeight;const tg=t.getContext('2d');tg.drawImage(im,0,0);
    const td=tg.getImageData(0,0,t.width,t.height).data;let x0=t.width,y0=t.height,x1=-1,y1=-1;
    for(let y=0;y<t.height;y++)for(let x=0;x<t.width;x++) if(td[(y*t.width+x)*4+3]>90){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    if(x1<0) return;
    const bw=x1-x0+1,bh=y1-y0+1,f=Math.min(.66/(bw/gw),.84/(bh/gh)),w=bw*f/gw,hh=bh*f/gh;   // tamaño en partes de la pared
    const pinta=(cw,ch)=>{const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(t,x0,y0,bw,bh,(1-w)/2*cw,(1-hh)/2*ch,w*cw,hh*ch);return c;};
    const peq=pinta(gw,gh);
    listo(mascara(peq.getContext('2d').getImageData(0,0,gw,gh).data,gw,gh,pinta(W,H)));
  }catch(e){}};
  im.src=s;
}
defGame({id:'pintar',subject:'prehistoria',icon:'🖐️',title:'Pinta tu cueva',desc:'Pinta un animal en la roca, como en Altamira. Nivel 2: contorno con carbón y manos sopladas · Nivel 3: a la luz de la lámpara y casi de memoria',

  custom(stage,run,ctx){

    const paint=h('canvas',{class:'cv-paint',width:W,height:H,'aria-label':'Pared de la cueva para pintar'}),guide=h('canvas',{class:'cv-guide',width:W,height:H,'aria-hidden':'true'});

    const dentro=new Uint8Array(GW*GH),negro=new Uint8Array(GW*GH),fuera=new Uint8Array(GW*GH);   // casillas ya pintadas
    let tool=l===1?'rojo':'carbon',manos=0,avisos=0,down=false,last=null,holdT=0,holdAt=null,fin=false;
    const paso=h('p',{class:'cv-paso'}),barra=h('div',{class:'cv-barras'});
    const cuenta=()=>{let ci=0,cb=0,co=0;for(let i=0;i<GW*GH;i++){if(sil.m[i]&&dentro[i])ci++;if(sil.b[i]&&negro[i])cb++;if(fuera[i])co++;}
      return {relleno:ci/sil.n,borde:cb/sil.nb,sale:co/sil.n};};
    const metas=()=>l===1?[['Relleno',cuenta().relleno/.85]]:[['Contorno',cuenta().borde/.7],['Relleno',cuenta().relleno/.8],['Manos',manos/2]];
    function estado(){const ms=metas();
      barra.replaceChildren(...ms.map(([n,f])=>h('span',{class:'cv-meta'+(f>=1?' ok':'')},n,h('i',null,h('b',{style:`width:${Math.round(Math.min(1,f)*100)}%`})))));
      const f=ms.reduce((a,[,x])=>a+Math.min(1,x),0)/ms.length;ctx.meter(f,f>=.95?2:f>=.5?1:0);
      const sig=ms.find(([,x])=>x<1);paso.textContent=sig?(sig[0]==='Contorno'?'Ahora: el contorno, con carbón.':sig[0]==='Relleno'?'Ahora: rellena con ocre rojo.':'Ahora: deja dos manos sopladas (elige «Mano» y mantén el dedo quieto en la roca).'):'¡Lista! Toca «He terminado».';}
    function marca(x,y,r){const gx0=Math.max(0,Math.floor((x-r)/S)),gx1=Math.min(GW-1,Math.floor((x+r)/S)),gy0=Math.max(0,Math.floor((y-r)/S)),gy1=Math.min(GH-1,Math.floor((y+r)/S));
      for(let yy=gy0;yy<=gy1;yy++)for(let xx=gx0;xx<=gx1;xx++){const cx=(xx+.5)*S-x,cy=(yy+.5)*S-y;if(cx*cx+cy*cy>r*r)continue;const i=yy*GW+xx;
        if(sil.m[i]){dentro[i]=1;if(tool==='carbon')negro[i]=1;}else fuera[i]=1;}}
    function trazo(a,b){const r=tool==='carbon'?11:20;g.strokeStyle=g.fillStyle=TINTES[tool].c;g.globalAlpha=tool==='carbon'?.92:.8;g.lineCap='round';g.lineJoin='round';g.lineWidth=r*2;

    function manoEn(x,y){const R=74,c=document.createElement('canvas');c.width=c.height=R*2;const q=c.getContext('2d');
      for(let i=0;i<900;i++){const a=Math.random()*6.283,d=Math.pow(Math.random(),.6)*R,rr=1+Math.random()*3.2;q.fillStyle=TINTES.mano.c;q.globalAlpha=.5*(1-d/R)+.12;q.beginPath();q.arc(R+Math.cos(a)*d,R+Math.sin(a)*d,rr,0,6.283);q.fill();}
      q.globalAlpha=1;q.globalCompositeOperation='destination-out';q.font=`${R}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;q.textAlign='center';q.textBaseline='middle';q.fillText('🖐️',R,R+4);

    const pos=(cx,cy)=>{const r=paint.getBoundingClientRect();return {x:(cx-r.left)/r.width*W,y:(cy-r.top)/r.height*H};};

    arrastrable(paint,{

        tools.querySelectorAll('.cv-tool').forEach(x=>{x.classList.toggle('on',x.dataset.t===t);x.setAttribute('aria-checked',String(x.dataset.t===t));});

    const borrar=h('button',{class:'btn ghost cv-btn',onclick:()=>{if(fin)return;sfx.tap();g.clearRect(0,0,W,H);dentro.fill(0);negro.fill(0);fuera.fill(0);manos=0;estado();}},'🧽 Borrar');

    const say=TS['pinta'+l];

    stage.append(qline(l===1?`Pinta ${A.n}`:l===2?`Pinta ${A.n}: contorno, relleno y manos`:`Pinta ${A.n} a la luz de la lámpara`,say),wall,barra,paso,
      h('div',{class:'cv-bar'},tools,h('div',{class:'row'},ver,borrar,h('button',{class:'btn cv-btn',style:'--c:var(--verde)',onclick:acabar},'He terminado ✓'))));
    if(l===3) setTimeout(()=>{if(!fin)guide.classList.add('oculto');},reduced?1500:5000);

  }});

defGame({id:'fuego',subject:'prehistoria',icon:'🔥',title:'¡Enciende el fuego!',desc:'Frota hasta sacar la chispa, elige la yesca y echa la leña en su orden. Nivel 2: chispas con dos piedras, viento y trampas · Nivel 3: leña para toda la noche',
  recap(){return sabias(['pz-fuego','pz-lampara','pz-neandertal']);},

/* ================= CONSTRUYE LA PIRÁMIDE ================= */
/* medidas en «unidades»: el tablero mide 100 de ancho. w = ancho ideal de cada piso; cada piso es más estrecho que el de
   abajo, así que hay un margen para soltarlo (en la Acodada, los pisos de arriba se estrechan más deprisa: se «dobla»). */
const EG_PIR={
  1:{n:'la pirámide escalonada de Zoser',t:'Suelta cada bloque encima del anterior',w:[56,49,42,35,28,21],base:64,vel:36,viento:0,say:'pir1'},
  2:{n:'la Pirámide Acodada',t:'¡Cuidado con el viento!',w:[64,59,54,49,40,31,22,13],base:70,vel:40,viento:2,cada:2,say:'pir2'},
  3:{n:'la Gran Pirámide',t:'La Gran Pirámide: diez pisos y viento que cambia',w:[62,56.5,51,45.5,40,34.5,29,23.5,18,12.5],base:68,vel:38,viento:3,cada:1,vaiven:true,say:'pir3'},
};
defGame({id:'eg-piramide',subject:'egipto',icon:'🔺',title:'Construye la pirámide',
  desc:'Suelta cada bloque justo encima del anterior. Nivel 2: sopla el viento · Nivel 3: la Gran Pirámide, con diez pisos y viento que cambia',
  recap(l){return sabias([['eg_zoser','eg_trineo'],['eg_acodada','eg_trineo'],['eg_keops','eg_trineo']][l-1]);},
  custom(stage,run,ctx){
    egSolo(ctx);
    const L=lvD(run),P=EG_PIR[L],N=P.w.length,TOT=P.w.reduce((a,b)=>a+b,0),G=14,FH=Math.min(8.5,62/(N+2.6)),luego=egReloj(run);
    let i=0,sup={l:50-P.base/2,r:50+P.base/2},w=P.w[0],x=0,dir=1,ph=0,mov=null,cayendo=false,fin=false,vidas=3,kept=0,viento=0,vPiso=-1,avisado=false;
    const pon=(el,l,wd,k)=>{el.style.left=l+'%';el.style.width=wd+'%';el.style.bottom=(G+k*FH)+'%';el.style.height=FH+'%';};
    const piso=h('span',{class:'eg-pir-chip'}),cuerdas=h('span',{class:'eg-pir-chip eg-pir-cuerdas'}),vEl=h('span',{class:'eg-pir-chip eg-pir-viento',hidden:true});
    const base=h('div',{class:'eg-pir-base',style:`left:${sup.l}%;width:${P.base}%;bottom:${G-1.4}%`});
    const tablero=h('div',{class:'eg-pir l'+L},
      h('span',{class:'eg-pir-sol','aria-hidden':'true'}),h('span',{class:'eg-pir-lejos','aria-hidden':'true'}),h('span',{class:'eg-pir-rafaga','aria-hidden':'true'}),
      h('div',{class:'eg-pir-suelo','aria-hidden':'true'}),base,h('div',{class:'eg-pir-hud'},piso,cuerdas,vEl));
    const btn=h('button',{class:'btn big eg-soltar',onclick:()=>soltar()},'⬇️ ¡Suelta!');
    const pinta=()=>{piso.textContent=`Piso ${Math.min(i+1,N)} de ${N}`;cuerdas.replaceChildren(...(vidas?Array.from({length:vidas},()=>dibI('cuerda','➰')):['—']));cuerdas.setAttribute('aria-label',`Cuerdas: ${vidas}`);
      const n=Math.abs(viento);vEl.hidden=!P.viento;vEl.textContent=!viento?'Sin viento':viento>0?'Viento '+'»'.repeat(n):'«'.repeat(n)+' Viento';
      tablero.classList.toggle('v-der',viento>0);tablero.classList.toggle('v-izq',viento<0);};
    function nuevo(){
      if(fin) return;
      w=Math.min(P.w[i],sup.r-sup.l);
      if(P.viento&&i>=P.cada&&i%P.cada===0&&vPiso!==i){vPiso=i;viento=pick([-1,1])*rnd(1,P.viento);}   // si el bloque se cae, el viento de ese piso no cambia: se puede aprender de él
      dir=Math.random()<.5?1:-1;x=dir>0?0:100-w;ph=dir>0?-Math.PI/2:Math.PI/2;
      mov=h('div',{class:'eg-pir-bloque mov'});pon(mov,x,w,i+1.9);tablero.append(mov);cayendo=false;pinta();
    }
    const parar=bucle(dt=>{
      if(fin||cayendo||!mov) return;const R=100-w;
      if(P.vaiven){ph+=dt*P.vel*1.3/(R/2);x=R/2*(1+Math.sin(ph));}   // como un péndulo: despacio en los lados, deprisa en el centro
      else{x+=dir*P.vel*dt;if(x>R){x=R;dir=-1;}if(x<0){x=0;dir=1;}}
      mov.style.left=x+'%';});
    function trozo(l,wd,s){const t=h('div',{class:'eg-pir-bloque trozo',style:`--s:${s}`});pon(t,l,wd,i);tablero.append(t);luego(()=>t.remove(),850);}
    function soltar(){
      if(fin||cayendo||!mov||RUN!==run) return;cayendo=true;sfx.tap();
      const m=mov,xd=x+viento*4;m.classList.add('cae');m.style.left=xd+'%';m.style.bottom=(G+i*FH)+'%';
      luego(()=>posar(m,xd),reduced?0:300);
    }
    function posar(m,xd){
      const l=Math.max(xd,sup.l),r=Math.min(xd+w,sup.r),ov=r-l;mov=null;
      if(ov<2.5){   // no ha caído encima: se pierde entero y se rompe una cuerda
        m.classList.add('fuera');luego(()=>m.remove(),750);vidas--;sfx.ko();pinta();
        if(viento&&!avisado){avisado=true;showToast('¡Se lo llevó el viento!','El viento empuja el bloque mientras cae. Suéltalo un poco antes.');}
        else showToast('¡Al suelo!',vidas?`Te ${vidas===1?'queda 1 cuerda':'quedan '+vidas+' cuerdas'}.`:'Se han roto todas las cuerdas.');
        if(!vidas) return acabar(false);
        return luego(nuevo,500);}
      if(l-xd>.4) trozo(xd,l-xd,-1);
      if(xd+w-r>.4) trozo(r,xd+w-r,1);
      m.classList.remove('mov','cae');m.classList.add('puesto');m.style.left=l+'%';m.style.width=ov+'%';
      const entero=ov>=w-.4;kept+=ov;if(entero){sfx.ok();burst(m);}else{sfx.pop();
        if(viento&&!avisado&&w-ov>3){avisado=true;showToast('¡El viento!','El viento empuja el bloque mientras cae. Suéltalo un poco antes.');}}
      sup={l,r};i++;ctx.meter(kept/TOT,0);
      if(i===N) return acabar(true);
      luego(nuevo,entero?240:420);
    }
    function acabar(ok){
      fin=true;parar();btn.disabled=true;viento=0;pinta();const pct=Math.round(kept/TOT*100);
      if(ok){tablero.classList.add('hecha');
        if(L>1){const c=h('div',{class:'eg-pir-cima'}),cw=Math.min(sup.r-sup.l,9);c.style.left=((sup.l+sup.r)/2-cw/2)+'%';c.style.width=cw+'%';c.style.bottom=(G+N*FH)+'%';c.style.height=(FH*1.25)+'%';tablero.append(c);}
        sfx.star();burst(tablero);}
      const st=ok?(pct>=92?3:pct>=75?2:1):1;   // ajustado simulando errores de puntería de 50 a 200 milésimas
      luego(()=>ctx.finish(st,ok?`Has levantado ${P.n}: ${N} pisos, con el ${pct} % de la piedra en su sitio.`
        :`Se rompieron las cuerdas en el piso ${i+1} de ${N}. ¡Seguro que la próxima sale mejor!`),ok?1500:1000);
    }
    tablero.addEventListener('pointerdown',e=>{e.preventDefault();soltar();});
    stage.append(qline(P.t,EGS[P.say]),tablero,btn);
    nuevo();instr(EGS[P.say]);
  }});

defGame({id:'eg-momia',subject:'egipto',icon:'⚰️',title:'Prepara la momia',
  desc:'Elige qué toca en cada momento y hazlo con el dedo. Nivel 2: los órganos y los vasos canopos · Nivel 3: pistas para deducir, amuletos y los errores del aprendiz',
  recap(l){return sabias([['eg_natron','eg_gatomomia'],['eg_canopos','eg_gatomomia'],['eg_escarabeo','eg_gatomomia']][l-1]);},
  custom(stage,run,ctx){
    egSolo(ctx);
    const L=lvD(run),pasos=EG_ORDEN[L],luego=egReloj(run),total=pasos.length+(L===3?1:0);
    let paso=0,fase='elige',err=0,fallosPaso=0,alZona=null,frota=false,apretado=false;

/* ================= EL LABERINTO DE LA TUMBA ================= */
/* c×r salas; f = cuánta antorcha de más sobre un buen camino; osc = a oscuras; pozo = hace falta un tablón; puertas = 1 o 3 (dos falsas) */
const EG_TUM={1:{c:5,r:4,f:1.35,osc:false,pozo:false,puertas:1,say:'tum1',t:'Encuentra la llave y sal de la tumba'},
  2:{c:6,r:4,f:1.5,osc:true,pozo:true,puertas:1,say:'tum2',t:'A oscuras… y con un pozo'},
  3:{c:7,r:5,f:1.5,osc:true,pozo:true,puertas:3,say:'tum3',t:'Tres puertas: solo una es de verdad'}};
const EG_DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const EG_PSIG=['eg_buho','eg_leon','eg_pollito'];
const EG_PF=['La puerta del búho es falsa.','La puerta del león es falsa.','La puerta del pollito es falsa.'];
const EG_PN=['La puerta buena no es la del búho.','La puerta buena no es la del león.','La puerta buena no es la del pollito.'];
/* Laberinto al azar que siempre se puede resolver. Rejilla de (2c+1)×(2r+1): las salas están en las casillas impares y entre
   dos salas hay una casilla de paso. Se abre como un árbol (un solo camino entre dos sitios), mezclando «seguir por la
   última sala» y «volver a una cualquiera» para que salgan bastantes callejones donde esconder cosas. */
function egTumba(o){
  const C=o.c,R=o.r,W=2*C+1,H=2*R+1;
  for(let intento=0;intento<60;intento++){
    const ult=intento===59,g=Array.from({length:H},()=>Array(W).fill(1)),vis=new Set(['0,0']),act=[[0,0]];g[1][1]=0;
    while(act.length){const idx=Math.random()<.5?act.length-1:rnd(0,act.length-1),[x,y]=act[idx];
      const ns=EG_DIRS.filter(([dx,dy])=>x+dx>=0&&y+dy>=0&&x+dx<C&&y+dy<R&&!vis.has((x+dx)+','+(y+dy)));
      if(!ns.length){act.splice(idx,1);continue;}
      const [dx,dy]=pick(ns);g[2*y+1+dy][2*x+1+dx]=0;g[2*(y+dy)+1][2*(x+dx)+1]=0;vis.add((x+dx)+','+(y+dy));act.push([x+dx,y+dy]);}
    const libre=(x,y)=>y>=0&&x>=0&&y<H&&x<W&&g[y][x]===0;
    /* pasos desde una casilla a todas las demás (pasa: casillas por las que se puede ir) */
    const bfs=(sx,sy,pasa)=>{const d={[sx+','+sy]:0},prev={},q=[[sx,sy]];
      for(let n=0;n<q.length;n++){const [x,y]=q[n];for(const [dx,dy] of EG_DIRS){const nx=x+dx,ny=y+dy,k=nx+','+ny;
        if(!libre(nx,ny)||k in d||(pasa&&!pasa(k))) continue;d[k]=d[x+','+y]+1;prev[k]=x+','+y;q.push([nx,ny]);}}
      return {d,prev};};
    const D0=bfs(1,1),salas=[];
    for(let y=1;y<H;y+=2)for(let x=1;x<W;x+=2)if(x+y>2)salas.push(x+','+y);
    const xy=k=>k.split(',').map(Number);
    const callejones=salas.filter(k=>{const [x,y]=xy(k);return EG_DIRS.filter(([dx,dy])=>libre(x+dx,y+dy)).length===1;}).sort((a,b)=>D0.d[b]-D0.d[a]);   // del más lejano al más cercano
    if(callejones.length<o.puertas+4+(o.pozo?1:0)&&!ult) continue;
    const items={},pon=(k,it)=>{items[k]=it;};
    const puertas=callejones.slice(0,o.puertas);

    const buena=pick(puertas);
    puertas.forEach((k,j)=>pon(k,{t:'puerta',buena:k===buena,s:j}));
    /* el pozo: en el camino a la puerta buena, hacia la mitad, en una casilla de paso */
    let pozo=null;

      const pasos=cam.filter(k=>{const [x,y]=xy(k);return (x+y)%2===1;});
      if(pasos.length<4){if(!ult) continue;}else{pozo=pasos[Math.round((pasos.length-1)*.5)];pon(pozo,{t:'pozo'});}}
    const antes=pozo?bfs(1,1,k=>k!==pozo).d:D0.d;   // lo que se alcanza sin cruzar el pozo
    const elige=(pred,azar)=>{const a=callejones.filter(k=>!items[k]&&pred(k)),b=salas.filter(k=>!items[k]&&pred(k)),l=a.length?a:b;return l.length?(azar?pick(l):l[0]):null;};
    if(pozo){const t=elige(k=>k in antes);if(!t){if(!ult) continue;delete items[pozo];pozo=null;}else pon(t,{t:'tablon'});}
    const llave=(pozo&&elige(k=>!(k in antes)))||elige(()=>true);   // si hay pozo, la llave está al otro lado
    if(!llave) continue;pon(llave,{t:'llave'});
    for(let j=0;j<3;j++){const t=elige(()=>true,true);if(t)pon(t,{t:'tesoro',k:'eg_tes'+(j+1)});}
    /* un buen camino (ir siempre a lo más cercano que se pueda alcanzar) para calcular cuánto dura la antorcha */
    let pos='1,1',tengo=false,T=0;const pend=Object.keys(items).filter(k=>'llave tablon tesoro'.includes(items[k].t));

      if(!alc.length) break;const k=alc[0];T+=B[k];pos=k;if(items[k].t==='tablon')tengo=true;pend.splice(pend.indexOf(k),1);}
    if(pend.length&&!ult) continue;
    T+=bfs(...xy(pos)).d[buena];
    return {g,W,H,items,tesoros:Object.values(items).filter(i=>i.t==='tesoro').length,antorcha:Math.ceil(T*o.f)+(o.puertas>1?6:0)};
  }
}

/* ================= LAS OLIMPIADAS =================

   con una media de segundos puestos, 2. Los rivales tienen una «forma» de 0 a 1 que sube con el nivel. */
const GR_OL={
  carrera:{k:'corredor',n:'La carrera del estadio',e:'🏃',say:'ol_carrera',dato:'La carrera de Olimpia medía un estadio: unos 192 metros. Al principio era la única prueba de los Juegos.'},

  jabalina:{k:'jabalinista',n:'El lanzamiento de jabalina',e:'🎯',say:'ol_jabalina',dato:'La jabalina se lanzaba con una correa de cuero enrollada: así giraba en el aire y volaba más recta y más lejos.'},
  lucha:{k:'luchadores',n:'La lucha',e:'🤼',say:'ol_lucha',dato:'Ganaba quien derribaba tres veces al rival. Con la lucha se completaba el pentatlón: cinco pruebas para el atleta más completo.'},
};
const GR_OLP=[null,['carrera','disco','salto'],['carrera','salto','disco','jabalina'],['carrera','salto','disco','jabalina','lucha']];

defGame({id:'gr-olimpiadas',subject:'grecia',icon:'🏃',title:'Las Olimpiadas',desc:'Corre, lanza y salta contra otros atletas. Nivel 2: viento y rivales más fuertes · Nivel 3: el pentatlón entero, con la lucha',
  recap(lvl){return sabias([null,['gr-pz-corona','gr-pz-estadio','gr-pz-pesas'],['gr-pz-estadio','gr-pz-pesas','gr-pz-corona'],['gr-pz-cinisca','gr-pz-pesas','gr-pz-corona','gr-pz-estadio']][lvl]);},
  custom(stage,run,ctx){

    const pintaMarc=()=>marc.replaceChildren(h('span',{class:'gr-marc-t'},`Prueba ${Math.min(k+1,NP)} de ${NP}`),
      ...at.map(a=>h('span',{class:'gr-chip'+(a.yo?' yo':'')},a.n+' ',h('b',null,a.pts))));
    const conViento=id=>(id==='jabalina'&&L>=2)||(id==='disco'&&L===3);
    /* antes de cada prueba: cómo se juega y un dato de verdad */
    function presenta(){

      zona.replaceChildren(h('div',{class:'gr-ol-intro'},sprite('gr-ol-emo',P.k,P.e),qline(P.n,dice),
        h('p',{class:'gr-dato'},h('b',null,'¿Sabías que…? '),P.dato),
        h('button',{class:'btn big',onclick:()=>{sfx.pop();stopVoice();JUEGA[id]();}},'¡A competir! ▶')));
      instr(...dice);
    }
    /* al acabar una prueba: puestos y puntos. val: lo que ha hecho cada atleta, en el orden de «at» */
    function clasifica(val,fmt,mayor){
      alto(); const ord=at.map((a,i)=>({a,v:val[i]})).sort((x,y)=>(mayor?y.v-x.v:x.v-y.v)||(x.a.yo?-1:y.a.yo?1:0));   // si hay empate, gana el niño
      ord.forEach((o,i)=>{o.a.pts+=3-i;}); const puesto=ord.findIndex(o=>o.a.yo); k++;

        h('button',{class:'btn big',onclick:()=>{sfx.pop();ult?acaba():presenta();}},ult?'Ver el resultado ▶':'Siguiente prueba ▶')));
    }
    function acaba(){const p=at[0].pts,max=3*NP,camp=at.every(a=>a.yo||a.pts<=p);
      ctx.finish(p>=max-(NP>4?2:1)?3:p>=2*NP?2:1,`Has sumado ${p} puntos de ${max}. ${camp?'¡La corona de olivo es para ti!':'La corona de olivo se la lleva otro atleta: ¡a por ella!'}`);}

    /* ---- la carrera: un pie y otro, sin repetir pie ---- */
    function carrera(){
      const N=32,tr=at.slice(1).map(r=>(15-8*r.s)*(.97+Math.random()*.06));   // segundos que tarda cada rival
      let p=0,vis=0,t=0,on=false,ult='',fin=false;

        h('div',{class:'gr-deco'+(dibSrc('olivo')?' dib':''),'aria-hidden':'true'},dibI('olivo','🌳'),dibI('templo','🏛️'),dibI('olivo','🌳')),h('div',{class:'gr-meta','aria-hidden':'true'}),h('div',{class:'gr-meta-t'},'Meta: 192 m'),cuenta);
      const paso=l=>{if(!on||fin)return;
        if(l===ult){grTiembla(cor[0]);return;}   // dos veces el mismo pie: tropieza y no avanza
        ult=l;p++;pies.forEach(b=>b.classList.toggle('toca',b.dataset.l!==l));};
      const pies=['i','d'].map(l=>grPulsa(h('button',{class:'gr-pie','data-l':l,'aria-label':l==='i'?'Pie izquierdo':'Pie derecho'},h("span",{"aria-hidden":"true"},"🦶")),()=>paso(l)));
      zona.replaceChildren(h('div',{class:'gr-ol-juego'},pista,h('div',{class:'gr-pies'},pies[0],h('span',{class:'gr-pies-t'},'Un pie y otro, un pie y otro…'),pies[1])));
      T.later(()=>{cuenta.textContent='Listos…';},700);

      T.later(()=>{cuenta.hidden=true;},2300);
      parar=bucle(dt=>{if(!on)return;t+=dt;vis+=(Math.min(1,p/N)-vis)*Math.min(1,dt*12);
        cor[0].style.setProperty('--p',vis.toFixed(4));
        tr.forEach((x,i)=>cor[i+1].style.setProperty('--p',Math.min(1,t/x).toFixed(4)));
        if(!fin&&(p>=N||t>Math.max(...tr)+4)){fin=true;on=false;const mio=p>=N?t:99;
          T.later(()=>clasifica([mio,...tr],v=>v>90?'no ha llegado':grM(v)+' s',false),500);}});
    }

    /* ---- disco y jabalina: parar la barra de fuerza y después la aguja de la altura ---- */
    function lanzar(jab){
      const D=jab?60:30,w=conViento(jab?'jabalina':'disco')?pick([-1,1])*(L===2?.7:1):0,des=14*w;   // con viento, la mejor altura se mueve
      const perF=[0,1.5,1.2,1][L],perA=[0,2.1,1.7,1.4][L],CAMPO=D*1.12,pos=d=>12+d/CAMPO*84;
      const rv=at.slice(1).map(r=>D*(.5+.45*r.s)*(.97+Math.random()*.06)*(1+.06*w));
      let fase='fuerza',F=0,A=45,tt=0,n=0,mejor=0,u=0,dist=0;
      const barra=h('i'),aguja=h('i',{class:'gr-aguja'}),proy=h('span',{class:'gr-proy '+(jab?'jab':'dis'),hidden:true}),
        mia=h('span',{class:'gr-banda yo',hidden:true},h('small',null,'Tú')),txt=h('div',{class:'gr-ol-txt','aria-live':'polite'},'Tienes tres intentos: cuenta el mejor.');
      const boton=grPulsa(h('button',{class:'btn big gr-accion'},'✋ ¡Fuerza!'),accion);
      const campo=h('div',{class:'gr-campo'},
        w?h('div',{class:'gr-viento'},h('b',null,w<0?'⬅️ 💨 Viento en contra':'Viento a favor 💨 ➡️'),L===2?h('small',null,w<0?'Lanza más bajo':'Lanza más alto'):null):null,
        h('div',{class:'gr-fuerza','aria-hidden':'true'},barra),h('small',{class:'gr-rot f','aria-hidden':'true'},'Fuerza'),h('div',{class:'gr-angulo'+(L===1?' zona':''),'aria-hidden':'true'},aguja),h('small',{class:'gr-rot a','aria-hidden':'true'},'Altura'),
        [1,2,3].map(i=>h('span',{class:'gr-raya','aria-hidden':'true',style:`left:${pos(D*i/3).toFixed(1)}%`},`${D*i/3} m`)),
        sprite('gr-atleta',jab?'jabalinista':'discobolo','🤾'),
        rv.map((d,i)=>h('span',{class:'gr-banda'+(i?' alta':''),style:`left:${pos(d).toFixed(1)}%`},h('small',null,at[i+1].n))),mia,proy,h('div',{class:'gr-suelo','aria-hidden':'true'}));
      function accion(){
        if(fase==='fuerza'){F=grTri(tt/perF);fase='angulo';tt=0;boton.textContent='🎯 ¡Lanza!';sfx.tap();}
        else if(fase==='angulo'){A=5+80*grTri(tt/perA);const a=A-des,q=a>0&&a<90?Math.sin(2*a*Math.PI/180):0;
          dist=D*(.25+.75*F)*Math.max(.15,q)*(1+.06*w);fase='vuelo';u=reduced?.98:0;boton.disabled=true;proy.hidden=false;sfx.pop();}
      }
      function otro(){fase='fuerza';tt=0;boton.disabled=false;boton.textContent='✋ ¡Fuerza!';proy.hidden=true;aguja.style.transform='';}
      zona.replaceChildren(h('div',{class:'gr-ol-juego'},campo,txt,boton));
      parar=bucle(dt=>{
        if(fase==='fuerza'){tt+=dt;barra.style.height=(grTri(tt/perF)*100).toFixed(1)+'%';}

        else if(fase==='vuelo'){u=Math.min(1,u+dt/1.1);const alt=Math.pow(Math.sin(A*Math.PI/180),2)*.8,y=4*alt*u*(1-u);
          proy.style.left=(12+(pos(dist)-12)*u).toFixed(2)+'%';proy.style.bottom=(20+y*68).toFixed(2)+'%';
          if(jab)proy.style.transform=`translate(-50%,50%) rotate(${(-A*(1-2*u)).toFixed(1)}deg)`;

            txt.textContent=`Intento ${n} de 3: ${grM(dist)} m. ${consejo} Tu mejor marca: ${grM(mejor)} m.`;

    /* ---- el salto: saltar en la tabla sin pasarse y echar las pesas atrás en lo más alto ---- */
    function salto(){
      const dur=[0,2.3,1.9,1.6][L],TAB=56,pos=m=>TAB+m/7.6*(97-TAB),rv=at.slice(1).map(r=>(3.2+3.6*r.s)*(.98+Math.random()*.04));

        [2,4,6].map(m=>h('span',{class:'gr-raya','aria-hidden':'true',style:`left:${pos(m).toFixed(1)}%`},`${m} m`)),
        rv.map((m,i)=>h('span',{class:'gr-banda'+(i?' alta':''),style:`left:${pos(m).toFixed(1)}%`},h('small',null,at[i+1].n))),mia,atl);
      const pon=(l,alt)=>{atl.style.left=l.toFixed(2)+'%';atl.style.bottom=(20+alt).toFixed(2)+'%';};
      function fin(m,msg){fase='cae';n++;if(m>mejor){mejor=m;mia.hidden=false;mia.style.left=pos(m).toFixed(1)+'%';}
        txt.textContent=`Salto ${n} de 3: ${msg}${mejor?` Tu mejor marca: ${grM(mejor,2)} m.`:''}`;boton.disabled=true;
        T.later(()=>{if(n>=3)return clasifica([mejor,...rv],v=>v?grM(v,2)+' m':'nulo',true);

      function accion(){

/* ================= EL HILO DE ARIADNA =================
   Memoria de un camino en una cuadrícula. El camino nunca se cruza y cada paso va a una casilla de al lado; por eso,
   cuando el hilo está roto (nivel 3), las casillas que faltan se pueden deducir: solo se ocultan las de un tramo recto. */
function grCamino(N,len){
  const borde=[...Array(N*N).keys()].filter(c=>c%N===0||c%N===N-1||c<N||c>=N*(N-1));
  for(let t=0;t<300;t++){const p=[pick(borde)],visto=new Set(p);
    while(p.length<len){const c=p[p.length-1],x=c%N,y=(c/N)|0;
      const ns=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]].filter(([a,b])=>a>=0&&b>=0&&a<N&&b<N&&!visto.has(b*N+a)).map(([a,b])=>b*N+a);
      if(!ns.length)break;const n=pick(ns);p.push(n);visto.add(n);}
    if(p.length===len)return p;}
  return [...Array(len).keys()].map(i=>{const y=(i/N)|0,x=i%N;return y*N+(y%2?N-1-x:x);});   // por si acaso: un camino en zigzag
}
const GR_HILO=[null,{N:4,len:[4,5,6,7,8],paso:560},{N:5,len:[5,6,7,8,9],paso:480,vuelta:true},{N:5,len:[6,7,8,9,10],paso:430,vuelta:true,rotos:[1,1,2,2,2]}];
defGame({id:'gr-hilo',subject:'grecia',icon:'🧶',title:'El hilo de Ariadna',desc:'Recuerda el camino del laberinto del Minotauro. Nivel 2: vuelve por el hilo, al revés · Nivel 3: el hilo se ha roto, ¡deduce los trozos que faltan!',
  recap(lvl){return sabias(lvl===2?['gr-pz-cnosos','gr-pz-ovillo']:['gr-pz-ovillo','gr-pz-cnosos']);},
  custom(stage,run,ctx){

    let r=0,total=0,limpios=0,cam=[],ord=[],oc=new Set(),i=1,fallos=0,visto=false,fase='',tanda=0;
    const celdas=Array.from({length:N*N},(_,c)=>h('button',{class:'gr-lab-c','aria-label':`Casilla ${c+1}`,onclick:()=>toca(c)},h('span',{class:'gr-lab-e','aria-hidden':'true'})));
    const svg=grEl(`<svg class="gr-hilo" viewBox="0 0 ${N} ${N}" aria-hidden="true" focusable="false"><path/></svg>`),hp=svg.firstChild;
    const trazo=(cs,sin)=>{let d='',pen=false;cs.forEach(c=>{if(sin&&sin.has(c)){pen=false;return;}d+=(pen?'L':'M')+((c%N)+.5)+' '+(((c/N)|0)+.5);pen=true;});return d;};
    const ICO_D={'🚪':'gr-pz-cnosos','🐃':'minotauro','🤺':'teseo'};   // la entrada (el palacio de Cnosos), el Minotauro y Teseo
    const icono=(c,t)=>{celdas[c].firstChild.replaceChildren(t?dibI(ICO_D[t],t):'');};
    const pie=h('div',{class:'gr-hi-pie','aria-live':'polite'}),ovillos=h('span',{class:'gr-hi-vidas',role:'img','aria-label':'Ovillos que te quedan'}),ronda=h('span',{class:'gr-marc-t'});
    const ver=h('button',{class:'btn ghost gr-hi-ver',onclick:()=>{if(fase!=='juega'||visto)return;visto=true;ver.disabled=true;sfx.tap();muestra();}},'👀 Ver otra vez');
    const estado=()=>{ronda.textContent=`Camino ${Math.min(r+1,R)} de ${R}`;ovillos.replaceChildren(...Array.from({length:Math.max(0,3-fallos)},()=>h('i')));};
    function nueva(){
      const len=C.len[r],nr=C.rotos?C.rotos[r]:0;let rect=[];
      for(let t=0;t<60;t++){cam=grCamino(N,len);
        rect=[];for(let j=1;j<len-1;j++){const a=cam[j-1],b=cam[j+1];if(Math.abs(a-b)===2||Math.abs(a-b)===2*N)rect.push(j);}   // casillas en mitad de un tramo recto

        if(i>=ord.length)hecho();return;}
      if(ord.indexOf(c)>=0&&ord.indexOf(c)<i)return;   // una casilla por la que ya ha pasado: no cuenta
      fallos++;estado();sfx.ko();grTiembla(celdas[c]);
      if(fallos>=3){solucion();return;}
      showToast(pick(RETRY),fallos===1?'El hilo pasa siempre a una casilla de al lado: arriba, abajo, a la izquierda o a la derecha.':'Te queda un intento. Si no te acuerdas, toca «Ver otra vez».');
    }
    function sigue(ms){ctx.meter(total/R,0);T.later(()=>{r++;if(r>=R)return acabar();nueva();},ms);}
    function hecho(){fase='pausa';const p=Math.max(.2,(visto?.7:1)-fallos*.3);total+=p;if(p===1)limpios++;burst(celdas[ord[ord.length-1]]);sfx.ok();

    /* tres fallos: se enseña el camino entero y se pasa al siguiente (nunca se queda atascado) */

      pie.textContent='Este era el camino. ¡A por el siguiente!';sigue(reduced?2600:2000);}
    function acabar(){ctx.finish(grEst(total/R),`Has recorrido ${limpios} de ${R} caminos a la primera.`);}
    run.data.camino=()=>ord.slice();   // para las pruebas
    stage.append(h('div',{class:'gr-hi'},h('div',{class:'gr-hi-lado'},qline(L===1?'Repite el camino del hilo':L===2?'Vuelve por el hilo, al revés':'El hilo se ha roto: deduce y vuelve',say),
        h('div',{class:'gr-marc'},ronda,ovillos),pie,ver),
      h('div',{class:'gr-lab',style:`--n:${N}`},celdas,svg)));
    instr(say);nueva();

defGame({id:'gr-templo',subject:'grecia',icon:'🏛️',title:'Monta el templo',desc:'Construye un templo griego pieza a pieza, de abajo arriba. Nivel 2: elige el capitel dórico, jónico o corintio · Nivel 3: sin ayuda y con piezas que no son griegas',
  recap(lvl){return sabias(lvl===1?['gr-pz-capitel','gr-pz-partenon']:['gr-pz-partenon','gr-pz-capitel']);},
  custom(stage,run,ctx){
    const L=lvD(run),T=grReloj(run),n=L===3&&innerWidth>=600?6:4;   // seis columnas solo si caben sitios de buen tamaño

/* ================= LLEVA EL AGUA A LA CIUDAD =================
   Cada tramo es una máscara de bocas: N=1, E=2, S=4, O=8. Tocar un tramo lo gira un cuarto de vuelta a la derecha.
   El tablero se inventa al revés para que siempre tenga solución: primero el camino del manantial a la fuente (y los
   ramales a las demás), después se gira cada tramo al azar. */
const RO_DIRS=[[0,-1],[1,0],[0,1],[-1,0]];
const roGira=(m,r)=>((m<<r)|(m>>(4-r)))&15;                       // r cuartos de vuelta a la derecha (0–3)
const roTras=m=>((m&1)?8:0)|((m&2)?4:0)|((m&4)?2:0)|((m&8)?1:0);   // el tablero puesto de pie: se cambian filas por columnas
const roTipo=m=>{const n=[1,2,4,8].filter(b=>m&b).length;return n===4?'cruz':n===3?'te':n===2?(m===5||m===10?'recto':'codo'):'nada';};
const RO_BASE={recto:5,codo:3,te:7};
const RO_PIEZA_N={recto:'Tramo recto',codo:'Codo',te:'Tres bocas'};
const roFaltan=(m,t)=>{for(let k=0;k<4;k++) if(roGira(m,k)===t) return k;return 0;};
function roTramo(m){
  const d=['M50 50V0','M50 50H100','M50 50V100','M50 50H0'].filter((_,i)=>m&(1<<i)).join('');
  /* el giro va dentro del dibujo (en el <g>) para que el botón no cambie de tamaño mientras gira */
  return roSvg(`<g class="ro-gira"><path class="ro-muro" d="${d}"/><circle class="ro-muro-c" cx="50" cy="50" r="25"/><path class="ro-canal" d="${d}"/><circle class="ro-canal-c" cx="50" cy="50" r="14"/><path class="ro-olas" d="${d}"/></g>`,'0 0 100 100','ro-tramo-svg');
}
function roFlujo(T){
  const src=T.cells.find(c=>c.kind==='src'),wet=new Set([src]),pila=[src];
  while(pila.length){const c=pila.pop();
    for(let d=0;d<4;d++){if(!(c.m&(1<<d))) continue;
      const n=T.idx[(c.x+RO_DIRS[d][0])+','+(c.y+RO_DIRS[d][1])];
      if(n&&!wet.has(n)&&(n.m&(1<<((d+2)%4)))){wet.add(n);pila.push(n);}}}
  return {wet,llega:T.cells.every(c=>c.kind!=='dst'||wet.has(c))};
}
function roTablero({W,H,F,rotos=0},vert){
  const key=(x,y)=>x+','+y,dentro=(x,y)=>x>=0&&y>=0&&x<W&&y<H;let T=null;
  for(let n=0;n<300;n++){
    const obj={},ys=rnd(0,H-1),yf=pickN([...Array(H).keys()],F),visto=new Set(),camino=[];
    const une=(a,b)=>{const d=RO_DIRS.findIndex(([dx,dy])=>a[0]+dx===b[0]&&a[1]+dy===b[1]);
      obj[key(a[0],a[1])]=(obj[key(a[0],a[1])]||0)|(1<<d);obj[key(b[0],b[1])]=(obj[key(b[0],b[1])]||0)|(1<<((d+2)%4));};
    /* el camino principal: un paseo al azar que no se cruza (a veces tira hacia la fuente, a veces da un rodeo) */
    const baja=(x,y,tx,ty)=>{visto.add(key(x,y));camino.push([x,y]);if(x===tx&&y===ty) return true;
      let ds=shuffle([0,1,2,3]);const lejos=d=>Math.abs(x+RO_DIRS[d][0]-tx)+Math.abs(y+RO_DIRS[d][1]-ty);
      if(Math.random()<.55) ds.sort((a,b)=>lejos(a)-lejos(b));
      for(const d of ds){const nx=x+RO_DIRS[d][0],ny=y+RO_DIRS[d][1];if(dentro(nx,ny)&&!visto.has(key(nx,ny))&&baja(nx,ny,tx,ty)) return true;}
      camino.pop();return false;};
    if(!baja(0,ys,W-1,yf[0])) continue;
    camino.forEach((p,i)=>{if(i) une(camino[i-1],p);});
    obj[key(0,ys)]|=8;obj[key(W-1,yf[0])]|=2;
    /* los ramales a las otras fuentes: desde cada una, por casillas libres, hasta tocar lo que ya hay */

const RO_VAL={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};
function roRomano(n){let s='';for(const [v,r] of RO_TABLA) while(n>=v){s+=r;n-=v;}return s;}
function roValor(s){let t=0;for(let i=0;i<s.length;i++){const a=RO_VAL[s[i]],b=RO_VAL[s[i+1]]||0;t+=a<b?-a:a;}return t;}

defGame({id:'ro-circo',subject:'roma',icon:'🐎',title:'Carrera de cuadrigas',
  desc:'Esquiva los obstáculos del Circo Máximo durante siete vueltas. Nivel 2: más deprisa, y las curvas por dentro · Nivel 3: carrera contra los Verdes, los Azules y los Blancos',
  recap(lvl){return sabias(lvl===2?['ro-diocles','ro-delfines']:['ro-delfines','ro-diocles']);},
  custom(stage,run,ctx){
    const l=lvD(run),C=RO_CIRCO[l],N=7,TOTAL=N*C.lap,PX=.17,timers=[],luego=(f,ms)=>timers.push(setTimeout(f,ms));
    let dist=0,lane=1,mul=1,hits=0,palmas=0,buenas=0,lap=0,on=false,fin=false,W=0,U=0,golpeT=0,mPrev=-1,posPrev=0;
    alSalir(()=>timers.forEach(clearTimeout));
    /* toda la carrera se prepara de antemano: filas de obstáculos (en los niveles 2 y 3, a veces dos carriles tapados), palmas, y la meta de cada vuelta */
    const objs=[];let libreAnt=-1;
    for(let v=0;v<N;v++){const d0=v*C.lap;let d=d0+(v?.6:1.2);
      while(d<d0+C.lap-.8){
        if(Math.random()<C.dob){let libre=rnd(0,2);if(l<3&&libreAnt>=0&&Math.abs(libre-libreAnt)>1) libre=1;   // en el nivel 2 nunca hay que saltar dos carriles de golpe
          [0,1,2].forEach(x=>{if(x!==libre) objs.push({d,lane:x,t:'obs',k:pick(RO_OBST)});});
          if(Math.random()<.5) objs.push({d,lane:libre,t:'palma',k:'ro_palma'});libreAnt=libre;}
        else{const x=rnd(0,2);objs.push({d,lane:x,t:'obs',k:pick(RO_OBST)});
          if(Math.random()<.4) objs.push({d,lane:pick([0,1,2].filter(y=>y!==x)),t:'palma',k:'ro_palma'});libreAnt=-1;}
        d+=C.g[0]+Math.random()*(C.g[1]-C.g[0]);}
      objs.push({d:d0+C.lap*.45,lane:-1,t:'deco'});objs.push({d:d0+C.lap-.1,lane:-1,t:'meta'});if(l>1) objs.push({d:d0+C.lap-.28,lane:0,t:'guia'});}   // el aviso de la curva llega un poco antes que la meta
    const delf=Array.from({length:N},()=>sprite('ro-delfin','ro-delfines','🐬'));
    const vEl=h('b',{class:'ro-chip'},`Vuelta 1 de ${N}`),tEl=h('span',{class:'ro-chip suave'},'Tropiezos: 0'),pEl=h('span',{class:'ro-chip suave palmas'},dibI('ro_palma','🌿'),' 0'),posEl=l===3?h('b',{class:'ro-chip pos'},'Vas 1.º'):null;
    const carro=roCarro('#D63A2F','yo');
    const riv=l===3?[['#2E9E55',1],['#2F6FE0',.95],['#F4F1E6',.9]].map(([c,f],i)=>({f,d:0,ph:i*2.1,el:roCarro(c,'rival r'+i)})):[];
    const pista=h('div',{class:'ro-pista'+(l===3?' riv':'')+(l>1?' curvas':''),role:'img','aria-label':'La pista del circo'},h('div',{class:'ro-espina','aria-hidden':'true'}),h('div',{class:'ro-arena','aria-hidden':'true'}),riv.map(r=>r.el),carro);
    const ponCarro=()=>{carro.style.top=`calc(var(--y0) + var(--lh) * ${lane+.5})`;};
    function mueve(s){if(!on||fin) return;const n=Math.max(0,Math.min(2,lane+s));if(n===lane) return;lane=n;sfx.tap();ponCarro();}
    pista.addEventListener('pointerdown',e=>{if(!on||fin) return;const r=carro.getBoundingClientRect();mueve(e.clientY<r.top+r.height/2?-1:1);});
    const salida=h('button',{class:'btn big ro-salida',style:'--c:var(--roma)',onclick:()=>{if(on) return;on=true;salida.remove();sfx.pop();pista.classList.add('corre');}},'¡Salida! ▶');
    pista.append(salida);ponCarro();
    function flota(txt,cls){const f=h('span',{class:'ro-flota '+cls},txt);pista.append(f);luego(()=>f.remove(),900);}
    function hazObj(o){
      if(o.t==='meta') return h('div',{class:'ro-obj meta'},h('i'),h('i'),h('i'));
      if(o.t==='deco') return h('div',{class:'ro-obj obelisco'});
      if(o.t==='guia') return h('div',{class:'ro-obj guia',style:'top:calc(var(--y0) + var(--lh) * .5)'},'¡Por dentro! »»');
      return h('div',{class:'ro-obj '+o.t,style:`top:calc(var(--y0) + var(--lh) * ${o.lane+.5})`},cosaPic(o.k));
    }
    function curva(){if(l===1) return;
      if(lane===0){mul=1.5;buenas++;sfx.ok();flota('¡Curva perfecta!','ok');}
      else if(lane===2){mul=.5;flota('¡Muy abierta!','ko');}
      else flota('Curva normal','');}
    function choca(o){hits++;mul=.25;sfx.ko();carro.classList.add('golpe');golpeT=performance.now()+500;if(o.el) o.el.classList.add('roto');tEl.textContent=`Tropiezos: ${hits}`;flota('¡Uy!','ko');}
    function acaba(){
      fin=true;para();pista.classList.remove('corre');ctx.meter(1,0);
      const pal=palmas?` Has cogido ${palmas} ${palmas===1?'palma':'palmas'} de la victoria.`:'';
      if(l===3){const pos=1+riv.filter(r=>r.d>=TOTAL).length;
        return ctx.finish(pos===1?3:pos===2?2:1,(pos===1?'¡Has ganado la carrera! Los Rojos, primeros.':`Has llegado en ${pos}.º lugar, con ${hits} ${hits===1?'tropiezo':'tropiezos'}.`)+pal);}
      const st=l===1?(hits<=2?3:hits<=5?2:1):(hits<=3&&buenas>=4?3:hits<=7?2:1);   // quien no se mueve tropieza unas diez veces: no le basta para las dos estrellas
      ctx.finish(st,`Siete vueltas con ${hits} ${hits===1?'tropiezo':'tropiezos'}${l===2?` y ${buenas} ${buenas===1?'curva perfecta':'curvas perfectas'}`:''}.`+pal);
    }
    function pinta(){
      pista.style.setProperty('--bx',Math.round(-dist*W)+'px');
      for(const o of objs){const rel=o.d-dist;
        if(rel>1-PX+.2||rel<-PX-.25||(o.done&&o.t==='palma')){if(o.el){o.el.remove();o.el=null;}continue;}
        if(!o.el){o.el=hazObj(o);pista.append(o.el);}
        o.el.style.transform=`translate3d(${Math.round((PX+rel)*W)}px,0,0) translate(-50%,-50%)`;}
      riv.forEach(r=>{const rel=r.d-dist,fuera=rel>1||rel<-.4;r.el.hidden=fuera;if(!fuera) r.el.style.transform=`translate3d(${Math.round((PX+rel)*W)}px,0,0) translate(-50%,-50%)`;});
      if(golpeT&&performance.now()>golpeT){golpeT=0;carro.classList.remove('golpe');}
      if(posEl){const p=1+riv.filter(r=>r.d>dist).length;if(p!==posPrev){posPrev=p;posEl.textContent=`Vas ${p}.º`;}}
    }
    function paso(dt,t){
      const w=pista.clientWidth;if(!w) return;
      if(w!==W){W=w;U=Math.min(pista.clientHeight/100,w/170);pista.style.setProperty('--u',U+'px');}
      if(on&&!fin){
        mul+=(1-mul)*Math.min(1,dt*1.6);dist+=C.v*mul*dt;
        const cerca=22*U/W;
        for(const o of objs){if(o.done) continue;const rel=o.d-dist;
          if(o.t==='meta'){if(rel<=0){o.done=true;curva();}}
          else if((o.t==='obs'||o.t==='palma')&&o.lane===lane&&Math.abs(rel)<cerca){o.done=true;if(o.t==='palma'){palmas++;sfx.pop();pEl.replaceChildren(dibI('ro_palma','🌿'),` ${palmas}`);}else choca(o);}}
        riv.forEach(r=>{r.d+=C.v*r.f*(1+.05*Math.sin(t/900+r.ph))*dt;});
        const nl=Math.min(N,Math.floor(dist/C.lap));
        if(nl>lap){lap=nl;delf[lap-1].classList.add('baja');sfx.pop();if(lap<N) vEl.textContent=`Vuelta ${lap+1} de ${N}`;}
        const m=Math.round(dist/TOTAL*50);if(m!==mPrev){mPrev=m;ctx.meter(Math.min(1,dist/TOTAL),0);}
        if(dist>=TOTAL) return acaba();
      }
      pinta();
    }
    const para=bucle((dt,t)=>{if(RUN!==run) return para();paso(Math.max(0,dt),t);});   // dt nunca negativo, aunque el reloj del navegador dé un salto
    run.data.c={objs,mueve,paso,est:()=>({dist,lane,hits,buenas,on,fin})};   // para las pruebas
    const say=[null,RO_S.circo1,[RO_S.circo1,RO_S.circo2],[RO_S.circo2,RO_S.circo3]][l];
    stage.append(qline(l===3?'¡Gana a los Verdes, a los Azules y a los Blancos!':l===2?'Esquiva y coge las curvas por dentro':'Esquiva los obstáculos',say),
      h('div',{class:'ro-circo-hud'},h('span',{class:'ro-delfines','aria-label':'Siete delfines: uno por vuelta'},delf),vEl,posEl,tEl,pEl),
      h('div',{class:'ro-circo'},pista,h('div',{class:'ro-mandos'},h('button',{class:'ro-mando','aria-label':'Subir un carril',onclick:()=>mueve(-1)},'▲'),h('button',{class:'ro-mando','aria-label':'Bajar un carril',onclick:()=>mueve(1)},'▼'))));
    instr(...[].concat(say));
  }});

defGame({id:'ro-cuento',subject:'roma',icon:'🤔',title:'¿Verdad o cuento?',rounds:10,
  desc:'Mochi cuenta cosas de los romanos: ¿verdad o cuento? Nivel 2: ¿pudo pasar?, y por qué · Nivel 3: detectives de Hispania, lo que Roma nos dejó',
  recap(lvl){return sabias([['ro-estrigilo','ro-hipocausto','ro-pulgar'],['ro-hipocausto','ro-pulgar','ro-estrigilo'],['ro-merida','ro-italica','ro-julio']][lvl-1]);},
  prepare(run){const l=lvD(run);if(l>1) run.total=7;run.data.next=deck([null,RO_VC,RO_PUDO,RO_DET][l]);},
  make(run){return {l:lvD(run),d:run.data.next()};},
  render(q,stage,ctx,run){const d=q.d;
    if(q.l===1){
      const op=(v,ic,t)=>({value:v,label:h('span',{class:'opt-in'},h('span',{class:'ro-vc-ic','aria-hidden':'true'},ic),t)});
      /* con solo dos respuestas, quien falla no se lleva medio punto por acertar a la segunda (si no, bastaría con probar) */
      stage.append(mochiDice(d.s,'read'),qline(RO_S.vc,[d.s,RO_S.vc]),choices([op(true,'✅','¡Verdad!'),op(false,'📖','¡Cuento!')],d.v,ctx,{cls:'ro-vc',explain:d.why,voice:{post:d.why},
        hint:d.v?'Pues parece mentira… pero es verdad.':'Suena bien, pero es un cuento.',onPick:ok=>{if(!ok&&!run.missed) run.pts-=.5;}}));
      return instr(d.s,RO_S.vc);}
    if(q.l===2){
      stage.append(mochiDice(d.s,'think'),qline(RO_S.pudo,[d.s,RO_S.pudo]),choices(opcT(d.a,d.w),d.a,ctx,{wide:true,explain:d.why,voice:{post:d.why},hint:'Piensa qué había en Roma y qué llegó después.'}));
      return instr(d.s,RO_S.pudo);}
    stage.append(h('div',{class:'hx-hallazgo ro-caso'},h('div',{class:'hx-hallazgo-pics'},roEmo(d.ic)),h('p',null,d.s)),qline(RO_S.det,[d.s,RO_S.det]),
      choices(opcT(d.a,d.w),d.a,ctx,{wide:true,explain:d.why,voice:{post:d.why},hint:'Fíjate bien en la pista: ahí está la respuesta.'}));
    instr(d.s,RO_S.det);
  }});

<script>

/* ================= PORTADA DE MOCHI HISTORIA: EL PASILLO DEL TIEMPO =================

   · Arriba, Mochi viajera del tiempo y la entrada a «Mi museo» (las piezas que se ganan al acabar cada partida).

     Todos los lugares están abiertos desde el principio: cada niño empieza por lo que más le gusta.
   · Al final, las puertas de lo que llegará («Muy pronto»). */

  {name:'Piratas y exploradores',ic:'🧭',que:'Mapas, carabelas y la vuelta al mundo',say:'Detrás de esta puerta están los piratas y los exploradores. ¡Muy pronto podrás entrar!'},
  {name:'Grandes inventos',ic:'💡',que:'De la imprenta al cohete que llegó a la Luna',say:'Detrás de esta puerta están los grandes inventos. ¡Muy pronto podrás entrar!'},

const PORT={museo:'Este es tu museo. Cada vez que acabas un juego, ganas una pieza con su curiosidad.'};
const conJuegos=()=>SUBJECTS.filter(s=>gamesOf(s.id).length);
/* para que la estantería de trofeos solo enseñe los lugares que ya tienen juegos */
function withSubjects(list,fn){const all=SUBJECTS.slice();SUBJECTS.splice(0,SUBJECTS.length,...list);try{return fn();}finally{SUBJECTS.splice(0,SUBJECTS.length,...all);}}
function toque(el,cls,text){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);sfx.tap();if(DB.sound&&text) speak(text);}
function gameStars(g){return hasLevels(g)?[1,2,3].reduce((a,l)=>a+lvStars(g.id,l),0):bestStars(g.id);}
const piezasDe=sid=>Object.keys(PIEZA).filter(k=>PIEZA[k].sec===sid);
const mias=sid=>piezasDe(sid).filter(k=>tengo(k)).length;

/* ---------- un lugar: su paisaje, Mochi disfrazada, las estrellas, las piezas y todos sus juegos ---------- */
function lugar(s){
  const gs=gamesOf(s.id),pz=piezasDe(s.id);
  return h('article',{class:'hsec'+(hasTrophy(s.id)?' done':''),style:`--c:var(--${s.id})`,'data-sid':s.id},
    h('button',{class:'hsec-head',style:`background-image:url(img/esc-${s.id}.webp)`,onclick:()=>{sfx.pop();goSubject(s.id);},'aria-label':`${s.name}: ${gs.length} juegos`},
      h('span',{class:'hsec-velo','aria-hidden':'true'}),
      h('img',{class:'hsec-mochi',src:s.img,alt:''}),
      hasTrophy(s.id)?h('span',{class:'subj-cup','aria-label':'Trofeo conseguido'},'🏆'):null,
      h('span',{class:'hsec-name'},s.name),h('span',{class:'hsec-blurb'},s.blurb),
      h('span',{class:'hsec-datos'},subjBar(s.id),pz.length?h('span',{class:'hsec-pz'},`🏛️ ${mias(s.id)}/${pz.length}`):null)),
    h('div',{class:'dsec-games'},gs.map(g=>h('button',{class:'gchip',onclick:()=>{sfx.pop();openGame(g.id);}},
      h('span',{class:'gchip-ic','aria-hidden':'true'},g.icon),h('span',{class:'gchip-t'},g.title),
      h('span',{class:'gchip-st'},g.badge?g.badge():`★ ${gameStars(g)}`)))));
}
function puerta(e){
  return h('button',{class:'puerta','aria-label':`${e.name}: muy pronto`,
    onclick:ev=>{toque(ev.currentTarget,'tiembla',e.say);showToast(e.name,`${e.que}. ¡Muy pronto!`);},
    onanimationend:ev=>ev.currentTarget.classList.remove('tiembla')},
    h('span',{class:'puerta-arco','aria-hidden':'true'},h('span',{class:'puerta-hoja'},h('span',{class:'puerta-ic'},e.ic),h('span',{class:'puerta-pomo'}))),
    h('span',{class:'puerta-name'},e.name),h('span',{class:'puerta-cuando'},e.que),h('span',{class:'puerta-tag'},'Muy pronto'));
}

/* ---------- Mi museo: todas las piezas, por lugares; las que faltan se ven como siluetas ---------- */
function verPieza(k){
  document.querySelectorAll('.sheet').forEach(s=>s.remove());
  const close=()=>{stopVoice();sheet.remove();};
  const sheet=h('div',{class:'sheet',onclick:e=>{if(e.target===sheet)close();}},
    h('div',{class:'ficha',role:'dialog','aria-label':PIEZA[k].n,style:`--c:var(--${PIEZA[k].sec})`},piezaCard(k,false),h('button',{class:'btn',style:`--c:var(--${PIEZA[k].sec})`,onclick:()=>{sfx.tap();close();}},'Cerrar')));
  document.body.append(sheet); if(DB.sound) speak(PIEZA[k].dato);
}
function goMuseo(){
  RUN=null; CUR_SUB=null;
  const secs=conJuegos().filter(s=>piezasDe(s.id).length),tot=Object.keys(PIEZA).length,n=Object.keys(PIEZA).filter(k=>tengo(k)).length;
  mount(h('div',{class:'museo'},
    h('div',{class:'museo-head'},backBtn(goHome),h('div',null,h('h1',null,'🏛️ Mi museo'),h('p',null,`Tienes ${n} de ${tot} piezas. Cada partida que acabas te da una, con su curiosidad.`)),sayBtn(PORT.museo)),
    secs.map(s=>h('section',{class:'museo-sala',style:`--c:var(--${s.id})`},
      h('h2',null,h('img',{src:s.img,alt:''}),s.name,h('span',{class:'tag'},`${mias(s.id)} de ${piezasDe(s.id).length}`)),
      h('div',{class:'museo-piezas'},piezasDe(s.id).map(k=>tengo(k)
        ?h('button',{class:'mpieza',onclick:()=>{sfx.pop();verPieza(k);}},piezaPic(k),h('span',null,PIEZA[k].n))
        :h('button',{class:'mpieza falta','aria-label':'Pieza por descubrir',onclick:()=>{sfx.tap();showToast('Pieza por descubrir',`Juega en ${s.name} para ganarla.`);}},piezaPic(k),h('span',null,'¿…?'))))))));
  instr(PORT.museo);
}

goHome=function(){
  if(!askedPersist){askedPersist=true;try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}}
  const p=me(); if(!p) return goProfiles(); RUN=null; CUR_SUB=null; preloadVoices();
  const open=conJuegos(),t=totalStars(p),tot=Object.keys(PIEZA).length,np=Object.keys(PIEZA).filter(k=>tengo(k)).length;
  let pend=null; for(const s of open){const l=tLevels(s.id).find(l=>dueTrophy(s.id,l)); if(l){pend=[s.id,l];break;}}
  mount(h('div',{class:'dhome'},
      h('div',{class:'hero hx-hero'},mochi('wave'),
        h('div',{class:'bubble'},h('div',null,h('h1',null,`¡Hola, ${p.name}!`),h('p',null,t?`Llevas ${t} ${t===1?'estrella':'estrellas'}. ${APP.homeAsk}`:`${APP.homeAsk} ${APP.homePick}`)),sayBtn(SAY.home)),
        tot?h('button',{class:'museo-btn',onclick:()=>{sfx.pop();goMuseo();}},sprite('museo-btn-ic','templo','🏛️'),h('span',null,h('b',null,'Mi museo'),h('small',null,`${np} de ${tot} piezas`))):null),
      h('div',{class:'hsecs subjects'},open.map(lugar)),
      h('section',{class:'pasillo'},h('h2',{class:'pasillo-h'},'El pasillo del tiempo'),h('p',{class:'pasillo-p'},'Detrás de estas puertas hay más viajes. Tócalas para saber adónde llevan.'),h('div',{class:'puertas'},PRONTO.map(puerta)))),
    withSubjects(open,trophyShelf),installCard(),familiesBox());
  if(pend){setTimeout(()=>{if(!RUN&&!CUR_SUB&&!RW&&me()===p&&earnTrophy(pend[0],pend[1])) showReward(pend[0],true,true,pend[1]);},900);return;}
  if(!greeted){greeted=true;instr(SAY.home);}
};

/* ---------- el icono de cada juego, de plastilina (el emoji de antes queda de reserva en g.emo) ----------
   El motor pinta g.icon dentro de un span: aquí g.icon pasa a devolver, cada vez, una imagen nueva. */
const ICONO={inventos:'hacha',linea:'rueda',colado:'dinosaurio',epocas:'mamut',detectives:'craneo',pintar:'altamira',fuego:'fuego',
  'eg-piramide':'eg_keops','eg-momia':'eg_sarcofago','eg-jero':'eg_buho','eg-tumba':'eg_llave','eg-verdad':'eg_esfinge',
  'gr-olimpiadas':'corredor','gr-hilo':'gr-pz-ovillo','gr-templo':'templo','gr-dioses':'rayo','gr-verdad':'gr-pz-mascara',
  'ro-agua':'ro_fuente','ro-legion':'ro-tortuga','ro-mercado':'ro_anfora','ro-circo':'cuadriga-roja','ro-cuento':'ro-julio'};
for(const id in ICONO){const g=GAMES[id],s=g&&dibSrc(ICONO[id]); if(!s) continue;
  g.emo=g.icon; Object.defineProperty(g,'icon',{get:()=>dibImg(s),configurable:true});}

/* ---------- todo lo que dice Mochi en la app, por archivo de voz (lo usa mochi-motor/tools/frases.js para grabarlo) ---------- */
/* cómo se dicen los números con punto y las palabras difíciles */
const PRON=Object.assign({'3 millones':'tres millones','400.000':'cuatrocientos mil','15.000':'quince mil','10.000':'diez mil','7.000':'siete mil','5.500':'cinco mil quinientos',
  '5.000':'cinco mil','6.000':'seis mil','40.000':'cuarenta mil','66 millones':'sesenta y seis millones','Ötzi':'Otsi'},
  typeof EG_PRON==='object'?EG_PRON:{},typeof GR_PRON==='object'?GR_PRON:{},typeof RO_PRON==='object'?RO_PRON:{});
const VOICE_GROUPS=()=>({
  'hist-jugador':[SAY.hello,SAY.edit],
  'hist-portada':[SAY.home,PORT.museo,...PRONTO.map(e=>e.say),...conJuegos().map(s=>s.name),...conJuegos().flatMap(s=>[1,2,3].map(l=>rewardSay(s.id,l)))],
  ...(typeof PRE_VOICE==='function'?PRE_VOICE():{}),
  ...(typeof PRE2_VOICE==='function'?PRE2_VOICE():{}),
  ...(typeof EG_VOICE==='function'?EG_VOICE():{}),
  ...(typeof GR_VOICE==='function'?GR_VOICE():{}),
  ...(typeof RO_VOICE==='function'?RO_VOICE():{}),
});
</script>
<script>
"use strict";
/* ================= ARRANQUE ================= */
document.addEventListener('pointerup',()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}},{once:true});
if(me()) goHome(); else goProfiles();
if(location.hash==='#diag') diagPanel();
</script>

<script>
/* Service worker: guarda la app para usarla sin conexión. Al volver a la app (por ejemplo, desde la pantalla de inicio,
   donde puede pasar días abierta) se mira si hay versión nueva; cuando llega, la página se recarga sola en la portada. */
if('serviceWorker' in navigator&&isSecureContext){addEventListener('load',()=>{
  let tenia=!!navigator.serviceWorker.controller, ultima=Date.now();
  navigator.serviceWorker.register('sw.js').then(reg=>{
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-ultima>6e5){ultima=Date.now();try{reg.update().catch(()=>{});}catch(e){}}});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!tenia){tenia=true;return;}   // primera instalación: no hay nada que recargar
    window.__swNew=true;
    try{if(!RUN&&!CUR_SUB&&!RW&&!document.querySelector('.sheet,.confirm,form.form')){window.__swNew=false;location.reload();}}catch(e){}
  });
});}
</script>
